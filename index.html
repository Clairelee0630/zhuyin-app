<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>注音樂園 ♡</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD9E6">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" href="assets/icons/icon-192.png">
<style>
  :root{
    --cream:#FFF8EF;
    --pink:#FFD9E6;
    --pink-deep:#FF9FBF;
    --lavender:#EADCF8;
    --mint:#CFF1E4;
    --butter:#FFE9B3;
    --ink:#5B4A45;
    --ink-soft:#9C8A85;
    --white:#FFFFFF;
    --shadow:0 6px 0 rgba(255,159,191,0.35);
    --shadow-flat:0 4px 14px rgba(180,140,150,0.18);
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--cream);
    font-family:"PingFang TC","Microsoft JhengHei","Heiti TC",-apple-system,sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{padding:18px 18px 28px; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 6px;
    gap:6px;
  }
  .stat-chip{
    display:flex; align-items:center; gap:4px;
    background:var(--white); border-radius:999px;
    padding:7px 10px; font-weight:700; font-size:14px;
    box-shadow:var(--shadow-flat);
    white-space:nowrap;
  }
  .gear-btn{
    width:40px;height:40px; border-radius:50%;
    background:var(--white); box-shadow:var(--shadow-flat);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }

  /* ---------- home ---------- */
  .hero{
    text-align:center; margin:6px 0 18px;
  }
  .hero h1{
    font-size:26px; color:var(--pink-deep); font-weight:800;
    letter-spacing:.5px;
  }
  .hero .sub{
    margin-top:6px; font-size:14px; color:var(--ink-soft); font-weight:600;
  }
  .progress-row{
    display:flex; justify-content:center; gap:10px; margin:14px 0 20px;
  }
  .grid-home{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .tile{
    background:var(--white); border-radius:var(--radius-lg);
    padding:18px 10px; text-align:center;
    box-shadow:var(--shadow-flat);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(0.94);}
  .tile .emoji{font-size:34px;}
  .tile .label{font-size:15px; font-weight:800; color:var(--ink);}
  .tile.wide{grid-column:1/3;}
  .tile.row{flex-direction:row; justify-content:flex-start; gap:14px; padding:14px 18px; text-align:left;}
  .tile.row .tcol{display:flex; flex-direction:column; gap:2px;}
  .tile .tsub{font-size:12px; font-weight:700; color:var(--ink-soft);}
  .home-sec{font-size:14px; font-weight:800; color:var(--pink-deep); margin:16px 4px 8px;}
  .hero + .home-sec{margin-top:4px;}
  .grid-home .tile:not(.row){padding:14px 8px;}
  .grid-home.three{grid-template-columns:repeat(3,1fr); gap:10px;}
  .grid-home.three .tile{padding:12px 4px; gap:6px;} .grid-home.three .tile .emoji{font-size:30px;} .grid-home.three .tile .label{font-size:13px;}
  .tile.c-pink{background:var(--pink);}
  .tile.c-lav{background:var(--lavender);}
  .tile.c-mint{background:var(--mint);}
  .tile.c-butter{background:var(--butter);}

  /* ---------- generic header w/ back ---------- */
  .header-row{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .back-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--white); box-shadow:var(--shadow-flat);
    font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .header-row h2{font-size:19px; font-weight:800; flex:1;}

  /* ---------- table view ---------- */
  .cat-label{
    font-size:14px; font-weight:800; color:var(--pink-deep);
    margin:16px 0 8px 4px;
  }
  .symbol-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  }
  .symbol-card{
    background:var(--white); border-radius:var(--radius-md);
    aspect-ratio:1/1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    box-shadow:var(--shadow-flat); font-size:26px; font-weight:800;
  }
  .symbol-card .spk{font-size:14px; opacity:.55;}
  .symbol-card:active{transform:scale(0.92);}
  .random-btn{
    margin-top:18px; width:100%; padding:16px; border-radius:var(--radius-md);
    background:var(--pink-deep); color:#fff; font-weight:800; font-size:16px;
    box-shadow:var(--shadow); text-align:center;
  }
  .random-card{
    margin-top:16px; background:var(--white); border-radius:var(--radius-lg);
    padding:26px; text-align:center; box-shadow:var(--shadow-flat);
  }
  .random-card .big{font-size:52px; font-weight:800; margin:10px 0;}
  .listen-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--mint); padding:12px 22px; border-radius:999px;
    font-weight:800; font-size:15px; margin-top:8px;
  }

  /* ---------- question card (shared) ---------- */
  .qcard{
    background:var(--white); border-radius:var(--radius-lg);
    padding:26px 20px; text-align:center; box-shadow:var(--shadow-flat);
    margin-bottom:18px;
  }
  .qprompt{font-size:15px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;}
  .qmain{font-size:44px; font-weight:800; margin:8px 0;}
  .qmain.emoji-big{font-size:64px;}
  .speaker-big{
    margin:10px auto 0; width:64px; height:64px; border-radius:50%;
    background:var(--butter); display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:var(--shadow-flat);
  }
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .opt-btn{
    background:var(--white); border-radius:var(--radius-md);
    padding:18px 8px; font-size:20px; font-weight:800;
    box-shadow:var(--shadow-flat); border:3px solid transparent;
  }
  .opt-btn:active{transform:scale(0.95);}
  .opt-btn.correct{background:var(--mint); border-color:#7FD9B6;}
  .opt-btn.wrong{background:#FFE0E0; border-color:#FFAFAF;}
  .feedback-msg{
    text-align:center; font-weight:800; font-size:16px; min-height:24px;
    margin:12px 0; color:var(--pink-deep);
  }
  .progress-dots{display:flex; justify-content:center; gap:6px; margin-bottom:14px;}
  .dot{width:10px; height:10px; border-radius:50%; background:#EDE3DD;}
  .dot.filled{background:var(--pink-deep);}
  .qcounter{text-align:center; font-size:13px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}

  /* ---------- 讀題魔法學院 ---------- */
  .rbtxt{font-size:19px; font-weight:700; line-height:2.2; color:var(--ink);}
  .rbtxt ruby{ruby-align:center;}
  .rbtxt rt, .rd-hero rt{font-size:12px; font-weight:700; color:#8A6F68; letter-spacing:0;}
  .zy{font-weight:800; letter-spacing:1px; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  .zy.big{font-size:28px; letter-spacing:2px;}
  .rd-hero{font-size:22px; text-align:center; margin:4px 0 14px; font-weight:800;}
  .rd-hero.rbtxt{font-size:22px;}
  .rd-card{display:flex; align-items:center; gap:14px; background:var(--white); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow-flat); cursor:pointer;}
  .rd-card:active{transform:scale(.97);}
  .rd-card-ico{font-size:34px; width:44px; text-align:center;}
  .rd-card-t.rbtxt{font-size:20px; font-weight:800;}
  .rd-card-d.rbtxt{font-size:14px; color:var(--ink-soft);}
  .rd-q{padding:16px 14px; text-align:center;}
  .rd-pic{font-size:64px; line-height:1.2;}
  .rd-stem{font-size:26px; font-weight:800; margin:4px 0 8px;}
  .g-info{text-align:center;font-weight:800;color:var(--ink);margin:8px 0;font-size:15px;}
  .g-water{background:#FFF3C4;border-radius:14px;padding:8px 12px;text-align:center;font-weight:700;font-size:13px;color:#8A6F68;margin-bottom:10px;}
  .g-water.ok{background:#D9F3E4;color:#2F7A55;}
  .g-scene{position:relative;height:150px;border-radius:20px;overflow:hidden;margin-bottom:10px;border:3px solid #fff;background:linear-gradient(180deg,#CFEBFF 0%,#EAF7FF 55%,#BFE8C4 55%,#A6DDAE 100%);}
  .g-dec{position:absolute;transform:translate(-50%,0);line-height:1;pointer-events:none;} .g-ground{position:absolute;left:0;right:0;bottom:2px;height:26px;z-index:4;} .g-sf{position:absolute;bottom:0;font-size:20px;}
  .gFlutter{animation:gFlut 2.6s ease-in-out infinite;} .gFloat{animation:gFlt 3.4s ease-in-out infinite;}
  @keyframes gFlut{0%,100%{transform:translate(-50%,0) rotate(-6deg)}50%{transform:translate(-30%,-12px) rotate(8deg)}}
  @keyframes gFlt{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
  .g-decgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;} .g-decitem{background:#fff;border:2px solid #fff;border-radius:16px;padding:8px 2px;text-align:center;cursor:pointer;} .g-decitem.on{border-color:#7ED3A0;background:#F0FBF4;} .g-dn{font-size:11px;font-weight:800;color:var(--ink);} .g-dp{font-size:11px;font-weight:800;color:var(--pink-deep);}
  .g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .g-plot{background:#E8D2B8;border:3px solid #C9A67F;border-radius:18px;padding:10px 4px;text-align:center;min-height:104px;cursor:pointer;}
  .g-plot .g-ico{font-size:38px;line-height:1.2;} .g-plot .g-lab{font-size:11px;font-weight:800;color:#5B4A45;margin-top:2px;} .g-dots{font-size:10px;margin-top:2px;}
  .g-plot.locked{background:#E9E4E2;border-color:#CFC7C4;opacity:.8;} .g-plot.bloom{background:#FFE3EE;border-color:#FF9EC4;animation:gpulse 1.4s infinite;} .g-plot.magic{border-color:#B79CF0;}
  @keyframes gpulse{50%{transform:scale(1.04);}}
  .g-actions{display:flex;gap:10px;margin:14px 0;} .g-actions .rd-btn{flex:1;}
  .g-sec{font-weight:800;font-size:16px;color:var(--pink-deep);margin:10px 0 6px;}
  .g-mile{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:8px;}
  .g-mile.done{background:#EAF8EF;} .g-mi{font-size:32px;} .g-mt{flex:1;font-size:13px;line-height:1.5;color:var(--ink);} .g-mt span{color:var(--ink-soft);font-weight:700;font-size:12px;} .g-rw{color:var(--pink-deep)!important;} .g-note{color:#B07A00!important;}
  .g-mb{min-width:54px;text-align:center;font-weight:800;font-size:13px;color:var(--ink-soft);} .g-mb .rd-btn{padding:8px 10px;font-size:13px;}
  .g-bar{height:6px;background:#F0E4DF;border-radius:4px;margin-top:4px;overflow:hidden;} .g-bar i{display:block;height:100%;background:var(--pink-deep);}
  .a-tabs{display:flex;gap:6px;margin:8px 0 12px;} .a-tab{flex:1;border:0;border-radius:14px;padding:10px 4px;font-weight:800;background:#fff;color:var(--ink-soft);font-size:14px;} .a-tab.on{background:var(--pink-deep);color:#fff;}
  .a-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;} .a-card{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;border:2px solid #fff;}
  .a-card.t-rare{border-color:#B79CF0;} .a-card.t-special{border-color:#FFD66B;background:#FFF9E2;} .a-card.unk{opacity:.55;}
  .a-ico{font-size:40px;} .a-name{font-size:12px;font-weight:800;margin-top:2px;} .a-sub{font-size:11px;color:var(--ink-soft);font-weight:700;}
  .rd-guide{background:#FFF3C4;border:2px solid #FFD66B;border-radius:20px;padding:16px;margin:10px 0;text-align:center;}
  .rd-guide-t.rbtxt{font-size:18px;font-weight:800;color:#B07A00;}
  .rd-guide-b.rbtxt{font-size:22px;font-weight:800;margin-top:6px;}
  .rd-ask.rbtxt{font-size:22px; line-height:2.3; font-weight:800;}
  .rd-label{text-align:center; margin:4px 0 10px; color:var(--pink-deep);}
  .rd-label.rbtxt{font-size:18px; font-weight:800; color:var(--pink-deep);}
  .rd-opts{display:grid; gap:12px; margin-top:6px;}
  .rd-opts.two{grid-template-columns:1fr 1fr;}
  .rd-opts.one{grid-template-columns:1fr;}
  .rd-opt{position:relative; background:var(--white); border-radius:var(--radius-md); padding:12px 10px; min-height:64px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-flat); border:3px solid transparent; text-align:center;}
  .rd-opt:active{transform:scale(.97);}
  .rd-opt.sel{border-color:var(--pink-deep); background:#FFF0F6;}
  .rd-opt.correct{background:var(--mint); border-color:#7FD9B6;}
  .rd-opt.wrong{background:#FFE0E0; border-color:#FFAFAF;}
  .rd-opt:disabled{opacity:.65;}
  .rd-opt.static{cursor:default;}
  .rd-mark{position:absolute; right:8px; top:4px; font-weight:800; font-size:16px;}
  .rd-msg{min-height:28px; text-align:center; margin-top:10px; color:var(--pink-deep);}
  .rd-msg{font-size:16px; font-weight:800; line-height:2;}
  .rd-actions{display:flex; gap:10px; margin-top:16px;}
  .rd-btn{flex:1; padding:14px 10px; border-radius:var(--radius-md); font-weight:800; font-size:16px; text-align:center;}
  .rd-btn.main{background:var(--pink-deep); box-shadow:var(--shadow);}
  .rd-btn.main .rbtxt, .rd-btn.main rt{color:#fff;}
  .rd-btn.main:disabled{opacity:.45; box-shadow:none;}
  .rd-btn.ghost{background:var(--white); box-shadow:var(--shadow-flat); flex:0 0 38%;}
  .rd-hint{margin-top:12px; background:var(--butter); border-radius:var(--radius-md); padding:8px 12px; text-align:center;}
  .rd-fb{margin-top:14px; border-radius:var(--radius-md); padding:12px 14px; background:var(--white); box-shadow:var(--shadow-flat);}
  .rd-fb.good{border-left:6px solid #7FD9B6;} .rd-fb.bad{border-left:6px solid #FFAFAF;}
  .rd-fb-t.rbtxt{font-weight:800; font-size:19px;} .rd-fb-w.rbtxt{font-size:17px; color:var(--ink-soft);}
  .rd-wrong .rbtxt{font-size:17px;}

  /* ---------- result page ---------- */
  .result-card{
    background:var(--white); border-radius:var(--radius-lg); padding:30px 20px;
    text-align:center; box-shadow:var(--shadow-flat); margin-bottom:16px;
  }
  .result-card .big-emoji{font-size:56px;}
  .result-card .score{font-size:30px; font-weight:800; color:var(--pink-deep); margin:10px 0;}
  .stars-earned{font-size:26px; letter-spacing:2px; margin:6px 0;}
  .weak-chip{
    display:inline-block; background:var(--lavender); border-radius:999px;
    padding:6px 14px; font-weight:700; font-size:13px; margin:4px;
  }
  .action-btn{
    width:100%; padding:16px; border-radius:var(--radius-md); font-weight:800;
    font-size:16px; margin-top:10px; text-align:center;
  }
  .action-btn.primary{background:var(--pink-deep); color:#fff; box-shadow:var(--shadow);}
  .action-btn.secondary{background:var(--white); color:var(--ink); box-shadow:var(--shadow-flat);}

  /* ---------- stats/stars ---------- */
  .stat-card{
    background:var(--white); border-radius:var(--radius-lg); padding:18px 20px;
    box-shadow:var(--shadow-flat); margin-bottom:14px;
  }
  .stat-card .row{display:flex; justify-content:space-between; align-items:center; padding:6px 0;}
  .stat-card .row + .row{border-top:1px dashed #EFE4DD;}
  .stat-card .row .k{font-weight:700; color:var(--ink-soft); font-size:14px;}
  .stat-card .row .v{font-weight:800; font-size:16px;}
  .week-row{display:flex; justify-content:space-between; margin:10px 0;}
  .week-day{text-align:center; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .week-day .circle{
    width:28px;height:28px;border-radius:50%; margin:4px auto 0;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    background:#EFE4DD; color:#fff;
  }
  .week-day .circle.done{background:var(--mint); color:#2E7A5C;}
  .achieve-row{display:flex; gap:10px; overflow-x:auto; padding:4px 0 8px;}
  .achieve{
    flex:0 0 auto; width:88px; text-align:center; background:var(--white);
    border-radius:var(--radius-md); padding:12px 6px; box-shadow:var(--shadow-flat);
  }
  .achieve.locked{opacity:.35;}
  .achieve .a-emoji{font-size:26px;}
  .achieve .a-label{font-size:11px; font-weight:800; margin-top:4px;}

  /* ---------- parent settings ---------- */
  .setting-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--white); border-radius:var(--radius-md); padding:14px 16px;
    margin-bottom:10px; box-shadow:var(--shadow-flat);
  }
  .setting-row .label{font-weight:700; font-size:15px;}
  .switch{
    width:46px; height:26px; border-radius:999px; background:#EFE4DD; position:relative;
  }
  .switch.on{background:var(--pink-deep);}
  .switch .knob{
    width:20px; height:20px; border-radius:50%; background:#fff; position:absolute;
    top:3px; left:3px; transition:left .15s ease;
  }
  .switch.on .knob{left:23px;}
  .danger-btn{
    width:100%; padding:14px; border-radius:var(--radius-md); background:#FFE7E7;
    color:#C6534F; font-weight:800; margin-top:8px; text-align:center;
  }
  .lock-hint{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; font-weight:700;
  }
  .lock-hint .gear-big{font-size:40px; display:block; margin-bottom:14px;}
  .hold-progress{
    height:6px; background:#EFE4DD; border-radius:999px; overflow:hidden; margin-top:16px;
  }
  .hold-progress .fill{height:100%; background:var(--pink-deep); width:0%;}

  /* 領取動畫 */
  .burst{position:relative; height:0;}
  .burst span{position:absolute; left:50%; top:56px; font-size:20px; opacity:0; animation:burstOut .95s ease-out forwards;}
  @keyframes burstOut{0%{opacity:0; transform:translate(-50%,-50%) scale(.3);} 30%{opacity:1;} 100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25);}}
  @keyframes bunnyWiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
  @keyframes bunnySquish{0%{transform:scale(1,1)}30%{transform:scale(1.15,.82)}60%{transform:scale(.92,1.1) translateY(-8px)}100%{transform:scale(1,1)}}
  @keyframes bunnySpin{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-34px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
  @keyframes bunnyBounce3{0%,100%{transform:translateY(0)}15%{transform:translateY(-22px)}30%{transform:translateY(0)}45%{transform:translateY(-16px)}60%{transform:translateY(0)}75%{transform:translateY(-9px)}}
  @keyframes bunnyNuzzle{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-6deg)}75%{transform:translateX(10px) rotate(6deg)}}
  @keyframes bHeart{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.2)}}
  .b-heart{position:absolute;font-size:22px;pointer-events:none;animation:bHeart 1.1s ease-out forwards;}
  #bunnyBox{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
  @keyframes bunnyHop{0%{transform:translateY(0)} 35%{transform:translateY(-14px)} 70%{transform:translateY(0)} 85%{transform:translateY(-5px)} 100%{transform:translateY(0)}}
  @keyframes popIn{0%{transform:scale(.4);} 70%{transform:scale(1.15);} 100%{transform:scale(1);}}
  .pop-icon{animation:popIn .5s ease-out;}
  @media (prefers-reduced-motion:reduce){ .burst span,.pop-icon{animation:none;} .burst span{opacity:0;} }
  .acc-card.equipped{outline:3px solid var(--pink-deep);}
  .tab-row{display:flex; gap:8px; margin:0 0 12px;}
  .tab-btn{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-md); background:var(--white); font-weight:800; font-size:14px; box-shadow:var(--shadow-flat); cursor:pointer;}
  .tab-btn.on{background:var(--pink-deep); color:#fff;}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);

const SPELL_ITEM_POOL = [...WORD_BANK, ...TWO_SYLLABLE_BANK];

/* ---------- 拼音小高手：共用工具函式（全面以注音作答，國字僅作答對後回饋） ---------- */
function itemSyllables(item){ return item.syllables ? item.syllables : [{bopomofo:item.bopomofo, tone:item.tone}]; }
function fullSpellingItem(item){ return itemSyllables(item).map(s=>s.bopomofo + (TONE_MARKS[s.tone-1]||"")).join(' '); }
function mutateSyllableStr(syll, hard){
  const chars = syll.bopomofo.split('');
  const kind = Math.random()<0.5 ? 'tone' : 'swap';
  if(kind === 'tone'){
    let nt = syll.tone;
    while(nt === syll.tone) nt = 1 + Math.floor(Math.random()*4);
    return syll.bopomofo + (TONE_MARKS[nt-1]||"");
  } else {
    const idx = Math.floor(Math.random()*chars.length);
    const orig = chars[idx];
    let pool = hard ? confusablesFor(orig) : [];
    if(!pool.length) pool = ALL_SYMBOLS.filter(s=>s!==orig);
    const rep = pickRandom(pool);
    const nc = chars.slice(); nc[idx] = rep;
    return nc.join('') + (TONE_MARKS[syll.tone-1]||"");
  }
}
function mutateFullSpelling(item, hard){
  const sylls = itemSyllables(item);
  const idx = Math.floor(Math.random()*sylls.length);
  const parts = sylls.map((s,i)=> i===idx ? mutateSyllableStr(s,hard) : s.bopomofo+(TONE_MARKS[s.tone-1]||""));
  return parts.join(' ');
}
function buildOptionsForItem(item, hard){
  const correct = fullSpellingItem(item);
  const options = new Set([correct]);
  let tries = 0;
  while(options.size < 4 && tries < 40){
    tries++;
    const v = mutateFullSpelling(item, hard);
    if(v && v !== correct) options.add(v);
  }
  while(options.size < 4){
    const other = pickRandom(SPELL_ITEM_POOL);
    const alt = fullSpellingItem(other);
    if(alt !== correct) options.add(alt);
  }
  return shuffle([...options]);
}
function buildImageChoice(item, hard){
  return {
    kind:"image-choice", key:"word:"+item.id, item, label:item.word,
    prompt:"這是什麼？選選看 ♡",
    options: buildOptionsForItem(item, !!hard),
    answer: fullSpellingItem(item),
    render:(o)=>o
  };
}
function buildListenChoice(item, hard){
  return {
    kind:"listen-choice", key:"word:"+item.id, item, label:item.word,
    prompt:"🔊 聽一聽，選出正確的注音",
    options: buildOptionsForItem(item, !!hard),
    answer: fullSpellingItem(item),
    render:(o)=>o
  };
}
function buildFillBlank(item, hard){
  const sylls = itemSyllables(item);
  const sIdx = Math.floor(Math.random()*sylls.length);
  const syll = sylls[sIdx];
  const useTone = !!hard && Math.random() < 0.5;
  let answer, options, displayParts;
  if(useTone){
    answer = TONE_MARKS[syll.tone-1] || "";
    const allTones = [0,1,2,3,4].map(i=>TONE_MARKS[i]);
    const opts = new Set([answer]);
    shuffle(allTones).forEach(t=>{ if(opts.size<4) opts.add(t); });
    options = shuffle([...opts]);
    displayParts = sylls.map((s,i)=> i===sIdx ? s.bopomofo+"＿" : s.bopomofo+(TONE_MARKS[s.tone-1]||""));
  } else {
    const chars = syll.bopomofo.split('');
    const bIdx = chars.length - 1;
    answer = chars[bIdx];
    let pool = confusablesFor(answer);
    while(pool.length < 3){
      const r = pickRandom(FINALS.concat(MEDIALS));
      if(r !== answer && !pool.includes(r)) pool.push(r);
    }
    options = shuffle([answer, ...sample(pool,3)]);
    const blanked = chars.slice(0,bIdx).join('') + "＿";
    displayParts = sylls.map((s,i)=> i===sIdx ? blanked+(TONE_MARKS[s.tone-1]||"") : s.bopomofo+(TONE_MARKS[s.tone-1]||""));
  }
  return {
    kind:"fill-blank", key:"word:"+item.id, item, label:item.word,
    prompt: useTone ? "少了哪個聲調呢？" : "少了哪一個？",
    partial: displayParts.join(' '),
    options, answer,
    render:(o)=>(o===""?"無符號":o)
  };
}
function buildBuildQuestion(item, hard){
  return {
    kind:"build", key:"word:"+item.id, item, label:item.word,
    sylls: itemSyllables(item), step:0, collected:[], curMiss:0, totalMiss:0, hard:!!hard
  };
}
function buildSpellQuestion(){
  const lvl = STATE.spellLevel || 1;
  const r = Math.random();
  if(lvl === 1){
    const item = pickRandom(WORD_BANK);
    return r < 0.7 ? buildImageChoice(item,false) : buildFillBlank(item,false);
  } else if(lvl === 2){
    const item = pickRandom(TWO_SYLLABLE_BANK);
    return r < 0.6 ? buildListenChoice(item,false) : buildImageChoice(item,false);
  } else {
    const item = pickRandom(TWO_SYLLABLE_BANK);
    if(r < 0.4) return buildBuildQuestion(item, true);
    if(r < 0.7) return buildFillBlank(item, true);
    return buildListenChoice(item, true);
  }
}
function buildReviewSpellQuestion(item){
  const sylls = itemSyllables(item);
  return sylls.length > 1 ? buildListenChoice(item, true) : buildImageChoice(item, true);
}
function adjustSpellDifficulty(correct){
  if(correct){
    STATE.spellMissStreak = 0;
    STATE.spellStreak = (STATE.spellStreak||0) + 1;
    if(STATE.spellStreak >= 3 && STATE.spellLevel < 3){ STATE.spellLevel += 1; STATE.spellStreak = 0; }
  } else {
    STATE.spellStreak = 0;
    STATE.spellMissStreak = (STATE.spellMissStreak||0) + 1;
    if(STATE.spellMissStreak >= 2 && STATE.spellLevel > 1){ STATE.spellLevel -= 1; STATE.spellMissStreak = 0; }
  }
  saveState();
}
function isSpellKind(k){ return k==='image-choice' || k==='listen-choice' || k==='fill-blank' || k==='build'; }

  merged.unlockedOutfits = Array.isArray(parsed.unlockedOutfits) && parsed.unlockedOutfits.length ? parsed.unlockedOutfits : ["o1"];
  merged.ownedAccessories = Array.isArray(parsed.ownedAccessories) ? parsed.ownedAccessories : ["acc_pink_bow"];

  if(!merged.ownedRooms.includes("room_pink")) merged.ownedRooms.push("room_pink");
  if(!merged.ownedRooms.includes(merged.equippedRoom)) merged.equippedRoom = "room_pink";
  merged.bunny = Object.assign({affection:0, fedDate:"", petDate:"", petCount:0}, parsed.bunny||{});
  merged.quests = Object.assign({date:"", ids:[], claimed:[], bonus:false, rounds:{}}, parsed.quests||{});

  const rd0 = {total:0, intent:{ok:0,wrong:0}, answer:{ok:0,wrong:0}, byIntent:{}, byCat:{}, byQ:{}, wrongIds:[], rounds:{careful:0,solo:0,exam:0}, exams:[], reward:{day:"",ids:[]}};
  const pr = parsed.reading || {};
  merged.reading = Object.assign(rd0, pr);
  ["intent","answer","rounds","byIntent","byCat","byQ","reward"].forEach(k=>{ merged.reading[k] = Object.assign({}, rd0[k], pr[k]||{}); });
  merged.reading.intent = Object.assign({ok:0,wrong:0}, pr.intent||{}); merged.reading.answer = Object.assign({ok:0,wrong:0}, pr.answer||{});
  merged.reading.rounds = Object.assign({careful:0,solo:0,exam:0}, pr.rounds||{});

  merged.reading.wrongIds = Array.isArray(pr.wrongIds) ? pr.wrongIds : []; merged.reading.exams = Array.isArray(pr.exams) ? pr.exams : [];
  const g0 = {opened:false, seeds:{normal:0,magic:0}, plots:[null,null,null,null,null,null], openPlots:3, flowers:{}, items:[], harvested:0, claimed:[], learnDay:"", decor:{owned:[], placed:[]}};

// 檢查匯入檔格式；通過回傳 {ok:true, data}，否則回傳 {ok:false, msg}
function validateBackup(obj){
  if(!obj || typeof obj !== "object") return {ok:false, msg:"這不是正確的備份檔"};
  if(obj.app !== "zhuyin-app") return {ok:false, msg:"這不是「注音樂園」的備份檔"};
  const d = obj.data;
  if(!d || typeof d !== "object" || Array.isArray(d)) return {ok:false, msg:"備份檔裡沒有存檔資料"};
  if(!Number.isFinite(d.stars) || !Number.isFinite(d.gems) || d.stars < 0 || d.gems < 0) return {ok:false, msg:"備份檔的星星或鑽石資料不正確"};
  if((obj.schemaVersion||0) > 8) return {ok:false, msg:"這份備份來自比較新的版本，請先更新 App"};
  return {ok:true, data:d};
}

function updateStreak(){

  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  if(STATE.lastPracticeDate === yStr){ STATE.streak += 1; } else { STATE.streak = 1; }
  STATE.lastPracticeDate = t;
  STATE.history7[t] = true;
  saveState();
}
function logAttempt(correct){
  const t = todayStr();
  if(!STATE.practiceLog[t]) STATE.practiceLog[t] = {attempts:0, correct:0};
  STATE.practiceLog[t].attempts += 1;
  if(correct) STATE.practiceLog[t].correct += 1;
  updateStreak();
  saveState();
}

  STATE.mistakes[key].correctStreak = 0;

}
function recordCorrectFor(key){
  if(STATE.mistakes[key]){

    if(STATE.mistakes[key].correctStreak >= 3){

  }
}

function giftImplemented(g){
  if(g.type === "accessory" || g.type === "outfit") return true;
  if(g.type === "room") return FEATURES.room.implemented;
  return g.type === "castle" ? FEATURES.castle.implemented : false;
}
// "claimed" 已取得 / "claimable" 可領取 / "soon" 已達成但功能未開發 / "locked" 等級未到
function giftStatus(id){
  const g = REWARD_GIFTS[id];
  if(STATE.claimedRewards.includes(id)) return "claimed";
  if(curLevel() < g.level) return "locked";
  if(!giftImplemented(g)) return "soon";
  return "claimable";
}
function syncPendingRewards(){
  STATE.pendingRewards = STATE.pendingRewards.filter(id=> REWARD_GIFTS[id] && !STATE.claimedRewards.includes(id));
  Object.keys(REWARD_GIFTS).forEach(id=>{
    if(giftStatus(id) === "claimable" && !STATE.pendingRewards.includes(id)) STATE.pendingRewards.push(id);
  });
}
function claimReward(id){
  const g = REWARD_GIFTS[id];
  if(!g || giftStatus(id) !== "claimable") return false;
  STATE.claimedRewards.push(id);
  STATE.pendingRewards = STATE.pendingRewards.filter(x=>x!==id);
  if(g.type === "accessory" && !STATE.ownedAccessories.includes(g.itemId)) STATE.ownedAccessories.push(g.itemId);
  if(g.type === "outfit" && !STATE.unlockedOutfits.includes(g.itemId)) STATE.unlockedOutfits.push(g.itemId);
  if(g.type === "room" && !STATE.ownedRooms.includes(g.itemId)) STATE.ownedRooms.push(g.itemId);
  if(g.type === "castle") STATE.castleLevel = Math.max(1, STATE.castleLevel||1);
  saveState();
  return true;
}

  const g = REWARD_GIFTS[r.ref];
  return `${g.icon} ${g.name}${giftImplemented(g) ? "" : "（即將開放）"}`;
}

    STATE.pendingLevelUp = {lv:info.lv, title:info.title, emoji:info.emoji, rewards:info.rewards||[]};

}

  const pick = (arr, k)=> arr[(h*k + k) % arr.length];
  const readQ = pick(["q_read","q_rdround"], 3);
  const gardenQ = (STATE.garden && gUnlocked()) ? "q_water" : pick(["q_feed","q_pet"], 5);
  const classic = pick(["q_daily","q_spell","q_tone","q_listen","q_correct"], 7);
  const keepClaimed = (Q.date === t) ? Q.claimed : [];
  const ids = [readQ, gardenQ, classic];
  STATE.quests = {date:t, v:QUEST_VER, ids, claimed:keepClaimed.filter(x=>ids.includes(x)), bonus: Q.date === t ? !!Q.bonus : false, rounds: Q.date === t ? (Q.rounds||{}) : {}};

function questProgress(q){

  else if(q.kind === "correct") v = (STATE.practiceLog[todayStr()]||{}).correct || 0;
  else if(q.kind === "feed") v = STATE.bunny.fedDate === todayStr() ? 1 : 0;

  return Math.min(q.need, v);

// 疊圖：背景 → 公主服裝 → 頭部飾品 → 手持魔法棒。全部以公主容器百分比定位。
function princessStackHTML(outfit, H, opts){
  opts = opts || {};
  const an = OUTFIT_ANCHORS[outfit.id] || OUTFIT_ANCHORS.o1;
  const W = Math.round(H * an.aspect);
  const head = opts.noAcc ? null : accById(STATE.equippedHeadAccessory);
  const hand = opts.noAcc ? null : accById(STATE.equippedHandAccessory);
  let layers = "", back = "";
  const wing = opts.noAcc ? null : accById(STATE.equippedBackAccessory);
  if(wing && accClaimed(wing)){
    back = `<img class="acc-layer acc-wing" src="${wing.image}" alt="${wing.name}" style="position:absolute; left:${an.head.x*100}%; top:36%; width:${wing.w*100*0.9}%; transform:translate(-50%,-50%); pointer-events:none;">`;
  }
  if(head && accClaimed(head)){
    const cx = (an.head.x + head.ox * an.head.s) * 100;
    const cy = (an.head.y + head.oy * an.head.s * an.aspect) * 100;
    const wPct = head.w * an.head.s * 100;
    layers += `<img class="acc-layer acc-head" src="${head.image}" alt="${head.name}" style="position:absolute; left:${cx}%; top:${cy}%; width:${wPct}%; transform:translate(-50%,-50%) rotate(${(head.rot||0)+(an.head.rot||0)}deg); pointer-events:none;">`;
  }
  if(hand && accClaimed(hand)){
    layers += `<img class="acc-layer acc-hand" src="${hand.image}" alt="${hand.name}" style="position:absolute; left:${an.hand.x*100}%; top:${an.hand.y*100}%; width:${hand.w*100}%; transform-origin:50% ${WAND_GRIP_Y}%; transform:translate(-50%,-${WAND_GRIP_Y}%) rotate(${an.hand.rot||0}deg); pointer-events:none;">`;
  }

}

let voicesCache = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  if(voicesCache && voicesCache.length) return voicesCache;
  voicesCache = speechSynthesis.getVoices();
  return voicesCache;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ voicesCache = speechSynthesis.getVoices(); };
}
function bestZhVoice(){
  const voices = pickVoice() || [];
  return voices.find(v=>/zh[-_]TW/i.test(v.lang)) ||
         voices.find(v=>/zh[-_]Hant/i.test(v.lang)) ||
         voices.find(v=>/zh/i.test(v.lang)) ||
         null;
}
function speakTTS(text){
  if(!('speechSynthesis' in window)) return;
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
    }
    setTimeout(()=>{
      try{
        const u = new SpeechSynthesisUtterance(text);
        const zh = bestZhVoice();
        if(zh){ u.voice = zh; u.lang = zh.lang; }
        else { u.lang = "zh-TW"; }
        u.rate = 0.82;
        u.pitch = 1;
        speechSynthesis.speak(u);
      }catch(e){}
    }, 60);
  }catch(e){}
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const ZY_RE = /[ㄅ-ㄩ˙ˊˇˋ]/;
// 自動逐字標注音：{字|注音} 可指定特殊讀音
function rb(text){
  let out = "", i = 0;
  while(i < text.length){
    const ch = text[i];
    if(ch === "{"){ const j = text.indexOf("}", i); const p = text.slice(i+1, j).split("|"); out += `<ruby>${p[0]}<rt>${zhDisp(p[1])}</rt></ruby>`; i = j+1; continue; }
    if(ZY_RE.test(ch)){ let j = i; while(j < text.length && ZY_RE.test(text[j])) j++; out += `<span class="zy">${zhDisp(text.slice(i,j))}</span>`; i = j; continue; }
    if(RB_DICT[ch]) out += `<ruby>${ch}<rt>${zhDisp(RB_DICT[ch])}</rt></ruby>`;
    else { if(/[一-鿿]/.test(ch)) RB_MISSING.add(ch); out += ch === "\n" ? "<br>" : ch; }
    i++;
  }
  return out;
}

const RD_CATS = {read:"仔細讀題理解", pinyin:"拼音與聲調", pic:"看圖選注音", word:"詞語與句子理解"};
const RD_MODES = {careful:"細心讀題", solo:"獨立讀題", exam:"學校模擬考"};
const RD_DAILY_REWARD_CAP = 10;   // 每天最多 10 題可得 ⭐（同一題同一天只算一次）

function rdIntentOptions(q){
  const it = RD_INTENTS[q.intent];
  const wrong = shuffle(it.near).slice(0,2);
  return shuffle([q.intent, ...wrong]);
}
function rdStat(){ return STATE.reading; }
function rdEnsureDay(){
  const t = todayStr(), r = rdStat();
  if(!r.reward || r.reward.day !== t) r.reward = {day:t, ids:[]};
}
function rdRecord(res, q){
  const r = rdStat(); if(STATE.garden) STATE.garden.learnDay = todayStr(); questRound("rdq");
  r.total += 1;
  if(res.intentChecked){ if(res.intentFirstTry) r.intent.ok += 1; else r.intent.wrong += 1; }
  if(res.ansOk) r.answer.ok += 1; else r.answer.wrong += 1;
  const bi = r.byIntent[q.intent] = r.byIntent[q.intent] || {intentWrong:0, ansOk:0, ansWrong:0};
  if(res.intentChecked && !res.intentFirstTry) bi.intentWrong += 1;
  if(res.ansOk) bi.ansOk += 1; else bi.ansWrong += 1;
  const bc = r.byCat[q.cat] = r.byCat[q.cat] || {ok:0, wrong:0};
  if(res.ansOk) bc.ok += 1; else bc.wrong += 1;
  const bq = r.byQ[q.id] = r.byQ[q.id] || {seen:0, hints:0};
  bq.seen += 1; if(res.hint) bq.hints += 1;
  r.wrongIds = r.wrongIds.filter(x=>x !== q.id);
  if(!res.ansOk) r.wrongIds.push(q.id);
}
// 同一題同一天只給一次、每天有上限；答錯不扣任何東西
function rdReward(qid){
  rdEnsureDay();
  const rw = rdStat().reward;
  if(rw.ids.includes(qid) || rw.ids.length >= RD_DAILY_REWARD_CAP) return 0;
  rw.ids.push(qid); return 1;
}
function rdJudge(q, picked){
  const a = [...q.ans].sort().join(), b = [...picked].sort().join();
  return a === b;
}

let RD = null;
function rdStart(mode, ids){
  const pool = ids ? READING_BANK.filter(q=>ids.includes(q.id)) : READING_BANK;
  const qs = sample(pool, Math.min(10, pool.length));
  RD = {mode, qs, i:0, results:[], step:null, sel:new Set(), earned:0, tmp:null};
  rdPrepQuestion();
  go('reading-play');
}
function rdPrepQuestion(){
  const q = RD.qs[RD.i];
  RD.sel = new Set(); RD.order = shuffle(q.opts.map((_,i)=>i));
  RD.tmp = {intentTries:0, intentFirstTry:true, hint:false, picked:[], wrongIntents:[]};
  RD.iopts = rdIntentOptions(q);
  RD.step = RD.mode === "careful" ? "intent" : "answer";
  if(RD.mode === "solo" && Math.random() < 0.3) RD.step = "intent";   // 獨立讀題：隨機穿插讀題理解
  RD.tmp.askIntent = RD.step === "intent" && RD.mode !== "careful";   // 細心讀題只做「讀一讀」引導，不考選擇題
}
function rdStemHTML(q){
  let h = "";
  if(q.pic) h += `<div class="rd-pic">${q.pic}</div>`;
  if(q.stem) h += `<div class="rd-stem">${PURE_ZY.test(q.stem) ? `<span class="zy big">${zhDisp(q.stem)}</span>` : rb(q.stem).replace(/<span class="zy">/g,'<span class="zy big">')}</div>`;
  return h;
}

function rdIntentUI(body, q){
  if(RD.mode === "careful"){
    body.innerHTML = `<div class="rd-guide"><div class="rd-guide-t rbtxt">👀 ${rb("先讀一讀")}</div><div class="rd-guide-b rbtxt">${rb("這一題要我們：")}<br><b>${rb(RD_INTENTS[q.intent].text)}</b></div></div>

    body.querySelector('#gotBtn').addEventListener('click', ()=>{ RD.step = "answer"; render(); });
    return;
  }
  body.innerHTML = `<div class="rd-label rbtxt">${rb("這一題要我們做什麼？")}</div><div class="rd-opts one" id="iopts"></div><div class="rd-msg rbtxt" id="imsg"></div>`;
  const wrap = body.querySelector('#iopts');
  RD.iopts.forEach(id=>{
    const b = document.createElement('button'); b.className = "rd-opt"; b.innerHTML = `<span class="rbtxt">${rb(RD_INTENTS[id].text)}</span>`;
    if(RD.tmp.wrongIntents.includes(id)){ b.classList.add('wrong'); b.disabled = true; }
    b.addEventListener('click', ()=>{
      RD.tmp.intentTries += 1;
      if(id === q.intent){ RD.step = "answer"; render(); }
      else {
        RD.tmp.intentFirstTry = false; RD.tmp.wrongIntents.push(id);
        b.classList.add('wrong'); b.disabled = true;
        body.querySelector('#imsg').innerHTML = rb("再讀一次題目，看看要做什麼喔！");
      }
    });
    wrap.appendChild(b);
  });
}
function rdAnswerUI(body, q){
  const exam = RD.mode === "exam", careful = RD.mode === "careful";
  const syl = q.opts.every(o=>PURE_ZY.test(o));
  body.innerHTML = `<div class="rd-opts ${syl?'two':'one'}" id="aopts"></div>
    ${(RD.tmp.hint || careful) ? `<div class="rd-hint rbtxt">💡 ${rb(RD_INTENTS[q.intent].text)}</div>` : ``}
    <div class="rd-actions"><button class="rd-btn main" id="okBtn" ${RD.sel.size?'':'disabled'}><span class="rbtxt">${rb(exam && RD.i === RD.qs.length-1 ? "交卷" : "確定")}</span></button></div>`;
  const wrap = body.querySelector('#aopts');
  RD.order.forEach(idx=>{
    const b = document.createElement('button'); b.className = "rd-opt" + (RD.sel.has(idx) ? " sel" : ""); b.innerHTML = optHTML(q.opts[idx]);
    b.addEventListener('click', ()=>{
      if(q.kind === "single") RD.sel = new Set([idx]);
      else { if(RD.sel.has(idx)) RD.sel.delete(idx); else RD.sel.add(idx); }
      render();
    });
    wrap.appendChild(b);
  });
  const hb = body.querySelector('#hintBtn'); if(hb) hb.addEventListener('click', ()=>{ RD.tmp.hint = true; render(); });
  body.querySelector('#okBtn').addEventListener('click', ()=>{
    const picked = [...RD.sel]; const ok = rdJudge(q, picked);
    const res = {id:q.id, ansOk:ok, picked, hint:RD.tmp.hint, intentChecked:RD.tmp.askIntent, intentFirstTry:RD.tmp.intentFirstTry};
    RD.results.push(res);
    if(exam){ rdNext(); return; }
    rdRecord(res, q);
    if(ok){ const g = rdReward(q.id); if(g){ RD.earned += g; addStars(g); } }
    saveState();
    RD.step = "fb"; RD.last = res; render();
  });
}
function rdFeedbackUI(body, q){
  const res = RD.last;
  body.innerHTML = `<div class="rd-opts ${q.opts.every(o=>PURE_ZY.test(o))?'two':'one'}" id="fopts"></div>
    <div class="rd-fb ${res.ansOk?'good':'bad'}"><div class="rd-fb-t rbtxt">${res.ansOk ? rb("答對了！太棒了！") : rb("再想想，答案在這裡。")}</div><div class="rd-fb-w rbtxt">${rb(q.why)}</div>
    ${RD.mode === "solo" ? `<div class="rd-fb-w rbtxt" style="margin-top:6px;">${rb("題目要求：")}${rb(RD_INTENTS[q.intent].text)}</div>` : ``}</div>

  const wrap = body.querySelector('#fopts');
  RD.order.forEach(idx=>{
    const b = document.createElement('div'); b.className = "rd-opt static";
    const isAns = q.ans.includes(idx), isPick = res.picked.includes(idx);
    if(isAns) b.classList.add('correct'); else if(isPick) b.classList.add('wrong');
    b.innerHTML = optHTML(q.opts[idx]) + (isAns ? `<span class="rd-mark">✓</span>` : isPick ? `<span class="rd-mark">✗</span>` : ``);
    wrap.appendChild(b);
  });
  body.querySelector('#nextBtn').addEventListener('click', rdNext);
}
function rdNext(){
  if(RD.i < RD.qs.length - 1){ RD.i += 1; rdPrepQuestion(); render(); return; }
  rdFinish();
}
function rdFinish(){
  const r = rdStat();
  if(RD.mode === "exam"){
    RD.results.forEach((res,i)=>{ const q = RD.qs[i]; rdRecord(res, q); if(res.ansOk){ const g = rdReward(q.id); if(g){ RD.earned += g; addStars(g); } } });
    const score = RD.results.filter(x=>x.ansOk).length;
    r.rounds.exam += 1; r.exams.push({ts:Date.now(), score, total:RD.qs.length}); if(r.exams.length > 30) r.exams.shift();
  } else r.rounds[RD.mode] += 1;
  questRound("rdround");
  checkGameAchievements();
  saveState();
  go('reading-result');
}

const G_TIER = {common:"普通", rare:"稀有", special:"特別"};
const G_SEED_PRICE = 8, G_PLOT_PRICE = 15, G_PLOT_FREE = 3, G_PLOT_MAX = 6, G_WATER_NEED = 3;
const G_COLLECT = { c_book:{icon:"📖", name:"魔法書", how:"讀題練習累積 100 題"} };
function gState(){ return STATE.garden; }
function gUnlocked(){ return STATE.reading.total >= 10 || gState().opened; }
function todayLearned(){ return gState().learnDay === todayStr(); }
function markLearned(){ if(STATE.garden) STATE.garden.learnDay = todayStr(); }
function rdIntentAcc(){ const r = STATE.reading, n = r.intent.ok + r.intent.wrong; return {n, rate: n ? r.intent.ok / n : 0}; }
const G_MILES = [
  {id:"m10",  icon:"🌱", name:"打開秘密花園", text:"讀題練習 10 題", reward:"送 3 顆魔法花種子", ok:()=>STATE.reading.total>=10, prog:()=>[Math.min(STATE.reading.total,10),10]},
  {id:"m30",  icon:"✨", name:"魔法種子",     text:"讀題練習 30 題", reward:"1 顆稀有魔法種子", ok:()=>STATE.reading.total>=30, prog:()=>[Math.min(STATE.reading.total,30),30]},
  {id:"mint", icon:"💐", name:"讀題小花束",   text:"讀題理解答對率 80%（至少 10 題）", reward:"特別花：讀題小花束", ok:()=>{const a=rdIntentAcc();return a.n>=10&&a.rate>=0.8;}, prog:()=>{const a=rdIntentAcc();return [Math.min(a.n,10),10];}, note:"到「獨立讀題」做讀題理解小問題"},

  {id:"m100", icon:"📖", name:"魔法書",       text:"讀題練習 100 題", reward:"特別收藏品：魔法書", ok:()=>STATE.reading.total>=100, prog:()=>[Math.min(STATE.reading.total,100),100]},
];
function gMileClaimed(m){ return m.auto ? STATE.ownedAccessories.includes("acc_read_crown") : gState().claimed.includes(m.id); }
function gClaim(id){
  const g = gState(), m = G_MILES.find(x=>x.id===id);
  if(!m || m.auto || !m.ok() || g.claimed.includes(id)) return false;
  g.claimed.push(id);
  if(id==="m10"){ g.seeds.normal += 3; g.opened = true; }
  if(id==="m30") g.seeds.magic += 1;
  if(id==="mint") g.flowers.f_read = (g.flowers.f_read||0) + 1;
  if(id==="m100") g.items.push("c_book");
  saveState(); return true;
}
function gPlant(i, kind){
  const g = gState(), p = g.plots[i];
  if(i >= g.openPlots || p || g.seeds[kind] < 1) return false;
  g.seeds[kind] -= 1; g.plots[i] = {kind, water:0, lastWater:""}; saveState(); return true;
}
function gCanWater(p){ return p && p.water < G_WATER_NEED && p.lastWater !== todayStr(); }
function gWater(i){
  const p = gState().plots[i];
  if(!gCanWater(p) || !todayLearned()) return false;
  p.water += 1; p.lastWater = todayStr(); questRound("water"); saveState(); return true;
}
function gHarvest(i){
  const g = gState(), p = g.plots[i];
  if(!p || p.water < G_WATER_NEED) return null;
  const pool = Object.keys(G_FLOWERS).filter(k=>G_FLOWERS[k].tier === (p.kind==="magic" ? "rare" : "common"));
  const fid = pool[Math.floor(Math.random()*pool.length)];
  g.flowers[fid] = (g.flowers[fid]||0) + 1; g.harvested += 1; g.plots[i] = null; saveState(); return fid;
}
function gBuySeed(){ if(STATE.gems < G_SEED_PRICE) return false; STATE.gems -= G_SEED_PRICE; gState().seeds.normal += 1; saveState(); return true; }
function gBuyPlot(){ const g = gState(); if(g.openPlots >= G_PLOT_MAX || STATE.gems < G_PLOT_PRICE) return false; STATE.gems -= G_PLOT_PRICE; g.openPlots += 1; saveState(); return true; }

const G_DECOR = {
  d_rainbow:{icon:"🌈",name:"彩虹",price:80,x:50,y:6,sz:64,z:0},
  d_cabin:{icon:"🏡",name:"小木屋",price:100,x:84,y:38,sz:46,z:1},
  d_fountain:{icon:"⛲",name:"小噴泉",price:60,x:50,y:44,sz:44,z:2},
  d_lamp:{icon:"🏮",name:"花園燈",price:25,x:10,y:48,sz:30,z:2},
  d_bird:{icon:"🐦",name:"小鳥",price:30,x:16,y:16,sz:26,z:3,fly:"gFloat"},
  d_butterfly:{icon:"🦋",name:"小蝴蝶",price:40,x:30,y:30,sz:28,z:3,fly:"gFlutter"},
  d_bee:{icon:"🐝",name:"小蜜蜂",price:35,x:68,y:24,sz:24,z:3,fly:"gFlutter"},
  d_ladybug:{icon:"🐞",name:"瓢蟲",price:20,x:38,y:70,sz:20,z:3},
};
function gDecorBuy(id){
  const g = gState(), d = G_DECOR[id];
  if(!d || g.decor.owned.includes(id) || STATE.gems < d.price) return false;
  STATE.gems -= d.price; g.decor.owned.push(id); g.decor.placed.push(id); saveState(); return true;
}
function gDecorToggle(id){
  const g = gState(); if(!g.decor.owned.includes(id)) return false;
  const i = g.decor.placed.indexOf(id); if(i >= 0) g.decor.placed.splice(i,1); else g.decor.placed.push(id);
  saveState(); return true;
}
function gSceneHTML(){
  const g = gState();
  const items = g.decor.placed.filter(id=>G_DECOR[id]).sort((a,b)=>G_DECOR[a].z-G_DECOR[b].z).map(id=>{ const d=G_DECOR[id];
    return `<div class="g-dec ${d.fly||''}" style="left:${d.x}%;top:${d.y}%;font-size:${d.sz}px;z-index:${d.z};">${d.icon}</div>`; }).join("");
  const fl = Object.keys(G_FLOWERS).filter(k=>g.flowers[k]>0).slice(0,12).map((k,i)=>`<span class="g-sf" style="left:${6+i*7.6}%;">${G_FLOWERS[k].icon}</span>`).join("");
  return `<div class="g-scene">${items}<div class="g-ground">${fl}</div></div>`;
}
function plotHTML(i){
  const g = gState(), p = g.plots[i];
  if(i >= g.openPlots) return `<div class="g-plot locked" data-plot="${i}"><div class="g-ico">🔒</div><div class="g-lab">💎${G_PLOT_PRICE}</div></div>`;
  if(!p) return `<div class="g-plot empty" data-plot="${i}"><div class="g-ico">🟫</div><div class="g-lab">空的花圃</div></div>`;
  const stage = ["🌰","🌱","🌿","🌸"][p.water], bloom = p.water >= G_WATER_NEED;
  const lab = bloom ? "開花了！收成" : (p.lastWater === todayStr() ? "今天澆過了 ✓" : "可以澆水 💧");
  return `<div class="g-plot ${bloom?'bloom':''} ${p.kind==='magic'?'magic':''}" data-plot="${i}"><div class="g-ico">${stage}</div><div class="g-lab">${lab}</div><div class="g-dots">${[0,1,2].map(k=>k<p.water?"💧":"▫️").join("")}</div></div>`;
}

  app.appendChild(topStatsBar());
  const g = gState();
  const s = document.createElement('div'); s.className = "screen";

  s.innerHTML = `

    ${gSceneHTML()}

    <div class="g-sec">📚 讀題獎勵</div>
    ${G_MILES.map(m=>{ const [a,b] = m.prog(), done = gMileClaimed(m), can = m.ok() && !done && !m.auto;
      return `<div class="g-mile ${done?'done':''}"><div class="g-mi">${m.icon}</div><div class="g-mt"><b>${m.name}</b><br><span>${m.text}</span><br><span class="g-rw">🎁 ${m.reward}</span>${m.note&&!m.ok()?`<br><span class="g-note">${m.note}</span>`:''}<div class="g-bar"><i style="width:${Math.round(a/b*100)}%"></i></div></div>
        <div class="g-mb">${done?"✅":can?`<button class="rd-btn main" data-claim="${m.id}">領取</button>`:m.auto&&m.ok()?"去公主頁領":`${a}/${b}`}</div></div>`; }).join("")}`;
  app.appendChild(s); attachGear(app);
  s.querySelector('#backBtn').addEventListener('click', ()=> go('home'));
  s.querySelector('#albumBtn').addEventListener('click', ()=> go('magic-album'));
  s.querySelector('#seedBtn').addEventListener('click', ()=>{ if(gBuySeed()){ toast("買到 1 顆種子 🌰"); refreshKeepScroll(); } else toast("鑽石不夠唷，再多練習一下吧 ♡"); });
  s.querySelectorAll('[data-dec]').forEach(el=> el.addEventListener('click', ()=>{
    const id = el.dataset.dec, d = G_DECOR[id];
    if(g.decor.owned.includes(id)){ gDecorToggle(id); refreshKeepScroll(); return; }
    confirmDialog(`要用 ${d.price} 顆鑽石買「${d.name}」嗎？`, ()=>{ if(gDecorBuy(id)){ toast(`${d.icon} 擺進花園了！`); refreshKeepScroll(); } else toast("鑽石不夠唷，再多練習一下吧 ♡"); });
  }));
  s.querySelectorAll('[data-claim]').forEach(b=> b.addEventListener('click', ()=>{ if(gClaim(b.dataset.claim)){ toast("🎁 領到了！"); refreshKeepScroll(); } }));
  s.querySelectorAll('[data-plot]').forEach(el=> el.addEventListener('click', ()=> gPlotTap(+el.dataset.plot)));
}
function gPlotTap(i){
  const g = gState(), p = g.plots[i];
  if(i >= g.openPlots){
    if(i !== g.openPlots){ toast("要先打開前面的花圃唷"); return; }
    confirmDialog(`要用 ${G_PLOT_PRICE} 顆鑽石打開新花圃嗎？`, ()=>{ if(gBuyPlot()){ toast("新花圃打開了 🌱"); refreshKeepScroll(); } else toast("鑽石不夠唷 ♡"); });
    return;
  }
  if(!p){
    const opts = [];
    if(g.seeds.normal > 0) opts.push("normal"); if(g.seeds.magic > 0) opts.push("magic");
    if(!opts.length){ toast("還沒有種子，可以買種子或完成讀題獎勵 ♡"); return; }
    const kind = opts.includes("magic") ? null : "normal";
    if(kind){ gPlant(i, kind); toast("種下去了 🌱 學習後記得來澆水"); refreshKeepScroll(); return; }
    const ov = document.createElement('div'); ov.className = "confirm-overlay";
    ov.innerHTML = `<div class="confirm-box"><p>要種哪一種種子？</p><div class="confirm-btns" style="flex-direction:column;gap:8px;">
      ${g.seeds.normal>0?`<button class="rd-btn main" data-k="normal">🌰 普通種子（${g.seeds.normal}）</button>`:''}
      <button class="rd-btn main" data-k="magic">✨ 魔法種子（${g.seeds.magic}）→ 稀有花</button>
      <button class="rd-btn ghost" data-k="x">取消</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-k]').forEach(b=> b.addEventListener('click', ()=>{ const k=b.dataset.k; ov.remove(); if(k!=="x" && gPlant(i,k)){ toast("種下去了 🌱"); refreshKeepScroll(); } }));
    return;
  }
  if(p.water >= G_WATER_NEED){
    const f = gHarvest(i); const fl = G_FLOWERS[f];
    const ov = document.createElement('div'); ov.className = "confirm-overlay";
    ov.innerHTML = `<div class="confirm-box"><div style="font-size:18px;font-weight:800;color:var(--pink-deep);">🌸 開花了！</div><div style="font-size:64px;margin:10px 0;">${fl.icon}</div><p>${fl.name}（${G_TIER[fl.tier]}）<br><span style="font-size:12px;">已放進魔法圖鑑</span></p><div class="confirm-btns"><button class="rd-btn main" id="okF">太棒了</button></div></div>`;
    document.body.appendChild(ov); ov.querySelector('#okF').addEventListener('click', ()=>{ ov.remove(); refreshKeepScroll(); });
    return;
  }
  if(p.lastWater === todayStr()){ toast("今天已經澆過水了，明天再來 ♡"); return; }
  if(!todayLearned()){ toast("先去玩遊戲或讀題，再回來澆水喔 ♡"); return; }
  if(gWater(i)) { toast("💧 澆水囉！"); refreshKeepScroll(); }
}

/* ============================================================
   遊戲引擎（聽音找注音 / 拼音小高手 / 聲調大挑戰 / 每日10題 / 錯題練習）
   ============================================================ */
function buildListenQuestion(){
  const target = pickRandom(ALL_SYMBOLS);
  let pool = confusablesFor(target);
  const need = 3;
  while(pool.length < need){
    const r = pickRandom(ALL_SYMBOLS);
    if(r !== target && !pool.includes(r)) pool.push(r);
  }
  const wrongs = sample(pool, need);
  const options = shuffle([target, ...wrongs]);
  return {
    kind:"listen",
    key:"sym:"+target,
    label:target,
    prompt:"請聽聲音，選出正確的注音",
    autoPlay:target,
    options,
    answer:target,
    render:(opt)=>opt
  };
}

function buildToneQuestion(){
  const item = pickRandom(TONE_WORD_BANK);
  const mode = pickRandom(['pickSpelling','pickToneNumber']);
  if(mode === 'pickSpelling'){
    const correct = fullSpelling(item);
    const allTones = [1,2,3,4,5];
    const opts = new Set([correct]);
    shuffle(allTones).forEach(t=>{
      if(opts.size>=4) return;
      const s = item.bopomofo + (TONE_MARKS[t-1]||"");
      opts.add(s);
    });
    return {
      kind:"tone-spelling",
      key:"tone:"+item.id,
      label: item.word,
      prompt: item.word,
      item,
      options: shuffle([...opts]),
      answer: correct,
      render:(opt)=>opt
    };
  } else {
    const correctIdx = item.tone; // 1..5
    const opts = [1,2,3,4,5];
    return {
      kind:"tone-number",
      key:"tone:"+item.id,
      label: item.word,
      prompt: "「"+item.word+"」這個字是第幾聲？",
      item,
      options: opts,
      answer: correctIdx,
      render:(opt)=> renderToneOption(opt)
    };
  }
}

function renderToneOption(opt){
  const mark = TONE_MARKS[opt-1];
  return mark === "" ? "一聲(不標)" : mark;
}
function weightedMistakeKeys(){
  return Object.entries(STATE.mistakes).sort((a,b)=>b[1].count-a[1].count).map(e=>e[0]);
}
function buildWeakFocusedQuestion(){
  const keys = weightedMistakeKeys();
  if(!keys.length) return buildListenQuestion();
  const key = pickRandom(keys.slice(0, Math.max(3,Math.ceil(keys.length/2))));
  if(key.startsWith("sym:")){
    const sym = key.slice(4);
    let pool = confusablesFor(sym);
    while(pool.length<3){ const r=pickRandom(ALL_SYMBOLS); if(r!==sym && !pool.includes(r)) pool.push(r); }
    const options = shuffle([sym, ...sample(pool,3)]);
    return { kind:"listen", key, label:sym, prompt:"請聽聲音，選出正確的注音", autoPlay:sym, options, answer:sym, render:(o)=>o };
  }
  if(key.startsWith("word:")){
    const id = key.slice(5);
    const item = WORD_BANK.find(w=>w.id===id) || TWO_SYLLABLE_BANK.find(w=>w.id===id) || TONE_WORD_BANK.find(w=>w.id===id);
    if(!item) return buildListenQuestion();
    if(typeof item.tone !== 'number') return buildReviewSpellQuestion(item);
    return Math.random()<0.5 ? buildReviewSpellQuestion(item) : buildToneQuestionFor(item);
  }
  return buildListenQuestion();
}
function buildToneQuestionFor(item){
  const correctIdx = item.tone;
  return { kind:"tone-number", key:"tone:"+item.id, label:item.word, prompt:"「"+item.word+"」這個字是第幾聲？", item, options:[1,2,3,4,5], answer:correctIdx, render:(o)=>renderToneOption(o) };
}

function buildQuestionForMode(mode, dailySlotType){
  if(mode === "listen") return buildListenQuestion();
  if(mode === "spell") return buildSpellQuestion();
  if(mode === "tone") return buildToneQuestion();
  if(mode === "review") return buildWeakFocusedQuestion();
  if(mode === "daily"){
    if(dailySlotType==="recog") return Math.random()<0.5?buildListenQuestion():buildRecogQuestion();
    if(dailySlotType==="listen") return buildListenQuestion();
    if(dailySlotType==="spell") return buildSpellQuestion();
    if(dailySlotType==="tone") return buildToneQuestion();
    if(dailySlotType==="weak") return buildWeakFocusedQuestion();
  }
  return buildListenQuestion();
}
function buildRecogQuestion(){
  // 認注音：顯示注音符號，選正確發音代表字（用文字選項呈現）
  const target = pickRandom(ALL_SYMBOLS);
  let pool = confusablesFor(target);
  while(pool.length<3){ const r=pickRandom(ALL_SYMBOLS); if(r!==target && !pool.includes(r)) pool.push(r); }
  const wrongs = sample(pool,3);
  const options = shuffle([target, ...wrongs]);
  return {
    kind:"recog",
    key:"sym:"+target,
    label:target,
    prompt:"這個注音怎麼念？點下方聽聽看，再選出一樣的注音",
    autoSymbol:target,
    options,
    answer:target,
    render:(o)=>o
  };
}

function startRound(mode){
  const total = mode === "daily" ? 10 : 8;
  let slots = [];
  if(mode === "daily"){
    slots = ["recog","recog","listen","listen","spell","spell","tone","tone","weak","weak"];
  }
  ROUND = { mode, total, index:0, correctCount:0, streak:0, weakSet:new Set(), q:null, awaitingNext:false, slots };
  nextQuestion();
}
function nextQuestion(){
  if(ROUND.index >= ROUND.total){
    finishRound();
    return;
  }
  const slotType = ROUND.mode === "daily" ? ROUND.slots[ROUND.index] : null;
  ROUND.q = buildQuestionForMode(ROUND.mode, slotType);
  ROUND.awaitingNext = false;
  ROUND.attemptCount = 0;
  render();
}
function finishRound(){
  questRound(ROUND.mode);
  if(ROUND.mode === "daily"){
    STATE.dailyDone = Math.min(STATE.dailyTotal, STATE.dailyDone + ROUND.total);
    STATE.dailyCorrect += ROUND.correctCount;
    STATE.dailyWeak = [...ROUND.weakSet];
    if(ROUND.correctCount === ROUND.total){ addStars(5); }
    addStars(5);
    STATE.gameStats.dailyRounds = (STATE.gameStats.dailyRounds||0) + 1;
    checkGameAchievements();
    saveState();
  } else if(ROUND.mode === "spell"){
    STATE.gameStats.spellRounds = (STATE.gameStats.spellRounds||0) + 1;
    checkGameAchievements();
    saveState();
  } else if(ROUND.mode === "tone"){
    STATE.gameStats.toneRounds = (STATE.gameStats.toneRounds||0) + 1;
    checkGameAchievements();
    saveState();
  }
  go('result');
}

/* ---------------- 拼一拼（build）：多步驟注音積木組合 ---------------- */
function renderBuildQuestionUI(s, q){
  const item = q.item;
  const card = document.createElement('div');
  card.className = "qcard";
  const remaining = q.sylls.length - q.step;
  card.innerHTML = `
    <div class="qprompt">拼一拼，組出正確的注音 ♡</div>
    <div class="qmain emoji-big">${item.emoji}</div>
    <div class="qmain" id="buildProgress">${'＿ '.repeat(remaining).trim()}</div>
  `;
  s.appendChild(card);

  const feedback = document.createElement('div');
  feedback.className = "feedback-msg";
  feedback.id = "feedback";
  s.appendChild(feedback);

  const blockWrap = document.createElement('div');
  blockWrap.className = "options";
  s.appendChild(blockWrap);

  renderBuildBlocks(blockWrap, q, feedback, card);
}
function renderBuildBlocks(blockWrap, q, feedback, card){
  const syll = q.sylls[q.step];
  const correctStr = syll.bopomofo + (TONE_MARKS[syll.tone-1]||"");
  const n = q.hard ? 4 : (q.step === 0 ? 3 : 2); // 初期較少干擾選項，進階增加
  const optSet = new Set([correctStr]);
  let tries = 0;
  while(optSet.size < n && tries < 30){ tries++; const v = mutateSyllableStr(syll, q.hard); if(v !== correctStr) optSet.add(v); }
  const options = shuffle([...optSet]);
  blockWrap.innerHTML = "";
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.addEventListener('click', ()=> handleBuildTap(opt, correctStr, btn, blockWrap, q, feedback, card));
    blockWrap.appendChild(btn);
  });
}
function handleBuildTap(opt, correctStr, btnEl, blockWrap, q, feedback, card){
  if(ROUND.awaitingNext) return;
  if(opt === correctStr){
    finishBuildStep(correctStr, blockWrap, q, feedback, card);
  } else {
    btnEl.classList.add('wrong');
    q.curMiss = (q.curMiss||0) + 1;
    if(q.curMiss === 1){
      feedback.textContent = "再想想看 ♡";
    } else {
      q.totalMiss = (q.totalMiss||0) + 1;
      [...blockWrap.children].forEach((b)=>{ if(b.textContent===correctStr) b.classList.add('correct'); b.style.pointerEvents='none'; });
      feedback.textContent = "答案是這個唷～";
      setTimeout(()=> finishBuildStep(correctStr, blockWrap, q, feedback, card), 900);
    }
  }
}
function finishBuildStep(correctStr, blockWrap, q, feedback, card){
  q.collected.push(correctStr);
  q.step += 1;
  q.curMiss = 0;
  [...blockWrap.children].forEach(b=> b.style.pointerEvents='none');
  if(q.step >= q.sylls.length){
    ROUND.awaitingNext = true;
    const ok = !(q.totalMiss > 0);
    ROUND.streak = ok ? ROUND.streak + 1 : 0;
    if(ok) ROUND.correctCount += 1;
    logAttempt(ok);
    if(ok) recordCorrectFor(q.key);
    adjustSpellDifficulty(ok);
    if(!ok){ recordMistake(q.key, q.label, q.kind); ROUND.weakSet.add(q.label); }
    let gained = ok ? 1 : 0;
    if(ok && ROUND.streak > 0 && ROUND.streak % 5 === 0) gained += 2;
    if(gained > 0) addStars(gained);
    feedback.innerHTML = spellRevealHTML(q.item);
    const rp = feedback.querySelector('#revealPlayBtn');
    if(rp) rp.addEventListener('click', ()=> speakWord(q.item));
    speakWord(q.item);
    setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 1800);
  } else {
    const progress = card.querySelector('#buildProgress');
    const doneParts = q.collected.join(' ');
    const remaining = q.sylls.length - q.step;
    progress.textContent = doneParts + ' ' + '＿ '.repeat(remaining).trim();
    feedback.textContent = "答對了！繼續下一個 ♡";
    setTimeout(()=> renderBuildBlocks(blockWrap, q, feedback, card), 500);
  }
}

function isCorrectOption(q, opt){
  return opt === q.answer;
}

// 拼音小高手答對後的回饋：圖片＋國字＋完整注音＋可再聽一次（國字只在答對後才出現）
function spellRevealHTML(item){
  return `🎉 答對了！<br>
    <div style="margin-top:6px;">
      <span style="font-size:32px;">${item.emoji}</span>
      <span style="font-size:20px; margin-left:6px;">${item.word}</span>
    </div>
    <div style="font-size:20px; font-weight:800; margin-top:4px;">${fullSpellingItem(item)}</div>
    <div class="listen-btn" id="revealPlayBtn" style="margin-top:8px;">🔊 再聽一次</div>`;
}

function handleAnswer(opt, btnEl, optWrap){
  if(ROUND.awaitingNext) return;
  const q = ROUND.q;
  const correct = isCorrectOption(q, opt);
  const feedback = document.getElementById('feedback');
  ROUND.attemptCount = (ROUND.attemptCount||0) + 1;
  const spellKind = isSpellKind(q.kind);

  if(correct){
    btnEl.classList.add('correct');
    ROUND.awaitingNext = true;
    ROUND.streak += 1;
    ROUND.correctCount += 1;
    logAttempt(true);
    recordCorrectFor(q.key);
    if(q.kind === "listen" || q.kind === "recog") recordSymbolMastery(q.key);
    if(spellKind) adjustSpellDifficulty(true);
    let gained = 1;
    if(ROUND.streak > 0 && ROUND.streak % 5 === 0) gained += 2;
    addStars(gained);
    disableOptions(optWrap);
    if(spellKind && q.item){
      feedback.innerHTML = spellRevealHTML(q.item);
      const rp = feedback.querySelector('#revealPlayBtn');
      if(rp) rp.addEventListener('click', ()=> speakWord(q.item));
      setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 1800);
    } else {
      feedback.textContent = ROUND.streak>0 && ROUND.streak%5===0 ? `連續答對 ${ROUND.streak} 題！✨ +${gained}⭐` : `答對了！ +${gained}⭐`;
      setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 700);
    }
  } else {
    btnEl.classList.add('wrong');
    ROUND.streak = 0;
    if(ROUND.attemptCount === 1){
      feedback.textContent = "再想想看 ♡ 再聽一次！";
      if(q.autoPlay || q.autoSymbol) setTimeout(()=>speakSymbol(q.autoPlay||q.autoSymbol), 300);
      else if(q.item) setTimeout(()=>speakWord(q.item), 300);
      logAttempt(false);
    } else {
      // 第二次仍答錯：標示正解，記錄錯題
      feedback.textContent = "差一點點～答案是這個唷";
      logAttempt(false);
      if(spellKind) adjustSpellDifficulty(false);
      recordMistake(q.key, q.label, q.kind);
      ROUND.weakSet.add(q.label);
      disableOptions(optWrap, true, q, optWrap);
      ROUND.awaitingNext = true;
      setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 1200);
    }
  }
}
function disableOptions(optWrap, revealCorrect, q){
  [...optWrap.children].forEach(b=> b.style.pointerEvents = 'none');
  if(revealCorrect && q){
    [...optWrap.children].forEach((b,i)=>{
      const opt = q.options[i];
      if(isCorrectOption(q, opt)) b.classList.add('correct');
    });
    if(q.autoPlay || q.autoSymbol) speakSymbol(q.autoPlay||q.autoSymbol);
    else if(q.item) speakWord(q.item);
  }
}

// tone: got=已取得 / gift=可領取 / locked=尚未達成 / soon=即將開放
function albumRow(iconHTML, name, statusText, tone, claimId){
  const col = tone==="got" ? "#2E9C6B" : tone==="gift" ? "var(--pink-deep)" : "var(--ink-soft)";
  const dim = (tone==="locked" || tone==="soon");
  return `
    <div ${claimId ? `data-claim="${claimId}"` : ""} style="display:flex; align-items:center; gap:10px; background:${tone==='got'||tone==='gift' ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.45)'}; border-radius:14px; padding:10px 12px; margin-bottom:8px; ${claimId?'cursor:pointer;':''}">
      <div style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:26px; ${dim?'filter:grayscale(1); opacity:0.55;':''}">${iconHTML}</div>
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:800; color:${dim?'var(--ink-soft)':'var(--ink)'};">${name}</div>
        <div style="font-size:11px; color:${col}; font-weight:800; margin-top:2px;">${statusText}</div>
      </div>
      ${tone==="gift" ? `<div class="action-btn primary" style="margin:0; padding:6px 14px; width:auto; font-size:12px;">領取</div>` : ``}
    </div>`;
}
function accThumb(a){ return `<img src="${a.image}" alt="${a.name}" style="width:34px; height:34px; object-fit:contain; object-position:center;">`; }
function accObtain(a){
  if(accClaimed(a)) return {text:"✓ 已取得", tone:"got"};
  if(a.unlockType === "level"){
    const st = giftStatus(a.rewardId);
    if(st === "claimable") return {text:"🎁 可領取", tone:"gift", claim:a.rewardId};
    return {text:`🔒 Lv.${a.requiredLevel} 升級禮物`, tone:"locked"};
  }
  if(a.unlockType === "diamond") return {text:`💎${a.price} 解鎖`, tone:"locked"};
  if(a.unlockType === "achievement"){
    const sa = SPECIAL_ACHIEVEMENT_ITEMS.find(x=>x.id===a.saId);
    if(saStatus(sa) === "claimable") return {text:"🏆 可領取", tone:"gift", saClaim:sa.id};
    return {text:`🏆 ${sa.obtainText}（${Math.min(sa.need, achievementProgress(sa))}/${sa.need}）`, tone:"locked"};
  }
  return {text:"—", tone:"locked"};
}
function renderAlbum(){
  app.appendChild(topStatsBar());
  const s = document.createElement('div');
  s.className = "screen";
  const header = document.createElement('div');
  header.className = "header-row";
  header.innerHTML = `<div class="back-btn" id="backBtn">←</div><h2>收藏冊</h2>`;
  s.appendChild(header);

  const intro = document.createElement('div');
  intro.className = "qprompt";
  intro.style.margin = "0 0 10px";
  intro.textContent = "看看公主已經擁有的，以及下一個目標是什麼 ♡";
  s.appendChild(intro);

  function section(title, rowsHTML){
    const c = document.createElement('div');
    c.className = "stat-card";
    c.innerHTML = `<div style="font-size:14px; font-weight:800; margin-bottom:8px;">${title}</div>${rowsHTML}`;
    s.appendChild(c);
  }

  // 🔓 公主成長解鎖：只放「功能」；只有真正能操作的才顯示「已開放」
  section("🔓 公主成長解鎖", Object.keys(FEATURES).map(k=>{
    const f = FEATURES[k], st = featureStatus(k);
    if(st === "open")   return albumRow(f.icon, f.name, k==="castle" ? `✓ 已開放（${CASTLE_STAGES[castleLv()]} Lv.${castleLv()}）` : "✓ 已開放", "got");
    if(st === "gift")   return albumRow(f.icon, f.name, "🎁 可領取", "gift", "r_castle");
    if(st === "locked") return albumRow(f.icon, f.name, `🔒 Lv.${f.requiredLevel} 解鎖`, "locked");
    return albumRow(f.icon, f.name, "🚧 即將開放", "soon");
  }).join(""));

  // 🎁 公主升級禮物：實體物品，要領取才算取得
  section("🎁 公主升級禮物", Object.keys(REWARD_GIFTS).map(id=>{
    const g = REWARD_GIFTS[id], st = giftStatus(id);
    const icon = (g.type==="accessory"||g.type==="outfit"||g.type==="room") ? giftVisual(g, 30) : g.icon;
    if(st === "claimed")   return albumRow(icon, g.name, "✓ 已取得", "got");
    if(st === "claimable") return albumRow(icon, g.name, `🎁 可領取（Lv.${g.level}）`, "gift", id);
    if(st === "soon")      return albumRow(icon, g.name, `🚧 即將開放（已達成 Lv.${g.level}）`, "soon");
    return albumRow(icon, g.name, `🔒 Lv.${g.level} 升級禮物`, "locked");
  }).join(""));

  // 🏆 收藏：真正存在的物品，每個未取得的都寫「如何取得」
  section("👗 洋裝收藏", OUTFITS.map(o=>{
    const got = STATE.unlockedOutfits.includes(o.id);
    const thumb = `<img src="${o.image}" alt="${o.name}" style="width:34px; height:34px; object-fit:contain; object-position:center;">`;
    if(got) return albumRow(thumb, o.name, "✓ 已取得", "got");
    if(o.source === "achievement"){
      const sa = SPECIAL_ACHIEVEMENT_ITEMS.find(x=>x.id===o.saId);
      return saStatus(sa) === "claimable" ? albumRow(thumb, o.name, "🏆 條件達成，可領取", "gift", "sa:"+sa.id) : albumRow(thumb, o.name, `🏆 ${sa.obtainText}（${Math.min(sa.need, achievementProgress(sa))}/${sa.need}）`, "locked");
    }
    if(o.source === "level"){
      return giftStatus("r_limited_dress") === "claimable"
        ? albumRow(thumb, o.name, "🎁 可領取", "gift", "r_limited_dress")
        : albumRow(thumb, o.name, `🔒 Lv.${o.levelReq} 升級禮物`, "locked");
    }
    return albumRow(thumb, o.name, outfitLevelLocked(o) ? `🔒 Lv.${o.levelReq} 解鎖 ＋ 💎${o.price}` : `💎${o.price} 解鎖`, "locked");
  }).join(""));
  section("🏠 房間", ROOMS.map(r=>{
    const o = roomObtain(r);
    return albumRow(`<img src="${r.image}" alt="${r.name}" style="width:40px; height:30px; object-fit:cover; border-radius:6px; border:1.5px solid #5B4A45;">`, r.name, o.text, o.tone, o.claim);
  }).join(""));
  section("🐰 小兔兔", albumRow(`<img src="${bunnyImage()}" alt="小兔兔" style="width:34px; height:34px; object-fit:contain;">`, "小兔兔", `好感度 ${STATE.bunny.affection}/${BUNNY_MAX}`, "got")
    + albumRow(`<img src="assets/bunny/bunny_bow.svg" alt="蝴蝶結小兔兔" style="width:34px; height:34px; object-fit:contain; ${STATE.bunny.affection>=BUNNY_BOW_AT?'':'filter:grayscale(1);'}">`, "蝴蝶結小兔兔", STATE.bunny.affection>=BUNNY_BOW_AT ? "✓ 已取得" : `🐰 好感度 ${BUNNY_BOW_AT} 解鎖（${STATE.bunny.affection}/${BUNNY_BOW_AT}）`, STATE.bunny.affection>=BUNNY_BOW_AT ? "got" : "locked"));
  ACC_CATEGORIES.forEach(cat=>{
    section(`${cat.icon} ${cat.label}`, ACCESSORIES.filter(a=>a.category===cat.key).map(a=>{
      const o = accObtain(a);
      return albumRow(accThumb(a), a.name, o.text, o.tone, o.claim || (o.saClaim ? "sa:"+o.saClaim : undefined));
    }).join(""));
  });
  section("🏆 成就限定", SPECIAL_ACHIEVEMENT_ITEMS.map(a=>{
    const achieved = STATE.specialItemsUnlocked.includes(a.id);
    const prog = Math.min(a.need, achievementProgress(a));
    const st = saStatus(a);
    const ic = a.itemId ? accThumb(accById(a.itemId)) : a.outfitId ? `<img src="${getOutfit(a.outfitId).image}" style="width:34px;height:34px;object-fit:contain;">` : a.icon;
    if(st === "claimed") return albumRow(ic, a.name, "✓ 已取得", "got");
    if(st === "claimable") return albumRow(ic, a.name, "🏆 條件達成，可領取", "gift", "sa:"+a.id);
    if(achieved && !a.implemented) return albumRow(a.icon, a.name, `🚧 即將開放（條件已達成：${a.obtainText}）`, "soon");
    return albumRow(a.icon, a.name, `🏆 ${a.obtainText}（${prog}/${a.need}）`, "locked");
  }).join(""));

  app.appendChild(s);
  header.querySelector('#backBtn').addEventListener('click', ()=> go('princess'));
  s.querySelectorAll('[data-claim]').forEach(el=>{
    el.addEventListener('click', ()=>{ const c = el.getAttribute('data-claim'); if(c.startsWith("sa:")) showAchievementClaim(c.slice(3)); else showGiftClaim(c); });
  });
  attachGear(app);
}

    const owned = accClaimed(a), eq = accEquipped(a);
    const card = document.createElement('div');
    card.className = "symbol-card acc-card" + (eq ? " equipped" : "");
    card.style.cssText += "aspect-ratio:auto; padding:10px 6px; gap:4px;";
    let status;
    if(eq) status = "✨ 穿戴中";
    else if(owned) status = a.slot==="hand" ? "使用" : a.slot==="back" ? "背上" : "戴上";
    else status = accObtain(a).text.replace("✓ 已取得","");
    if(!owned && a.unlockType==="diamond") status = "🔒 💎" + a.price;
    if(!owned && a.unlockType==="achievement"){ const sa = SPECIAL_ACHIEVEMENT_ITEMS.find(x=>x.id===a.saId); status = saStatus(sa)==="claimable" ? "🏆 可領取" : `🏆 ${Math.min(sa.need, achievementProgress(sa))}/${sa.need}`; }
    card.innerHTML = `
      <div style="position:relative; width:64px; height:64px;">
        <img src="${a.image}" alt="${a.name}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; ${owned?'':'filter:grayscale(1) opacity(0.5);'}">

      <div style="font-size:12px; color:var(--pink-deep); font-weight:800;">${status}</div>`;
    card.addEventListener('click', ()=>{
      if(owned){
        if(eq){ unequipAccessory(a.slot); toast(a.name + " 已卸下"); }
        else { equipAccessory(a.id); toast(a.name + (a.slot==="hand" ? " 拿在手上了 ♡" : a.slot==="back" ? " 背好了 ♡" : " 戴好了 ♡")); }

        return;

      if(a.unlockType === "achievement"){
        const sa = SPECIAL_ACHIEVEMENT_ITEMS.find(x=>x.id===a.saId);

      if(a.unlockType === "diamond"){
        confirmDialog(`要用 ${a.price} 顆鑽石解鎖「${a.name}」嗎？`, ()=>{

      }
    });
    grid.appendChild(card);
  });

  app.appendChild(s);
  header.querySelector('#backBtn').addEventListener('click', ()=> go('princess'));

  attachGear(app);
}

      <div style="font-size:14px; font-weight:800; color:var(--pink-deep); margin-top:6px;">${cur.name}</div>

  }
  function renderGrid(){
    grid.innerHTML = "";
    OUTFITS.forEach(o=>{
      const unlocked = STATE.unlockedOutfits.includes(o.id);
      const equipped = STATE.equippedOutfit === o.id;
      const levelLocked = !unlocked && outfitLevelLocked(o);
      const card = document.createElement('div');
      card.className = "symbol-card";
      card.style.aspectRatio = "auto";
      card.style.padding = "10px 6px";
      card.style.gap = "4px";
      let statusHTML;
      if(equipped) statusHTML = "✨ 穿著中";
      else if(unlocked) statusHTML = "點一下換上";
      else if(o.source === "level") statusHTML = giftStatus("r_limited_dress")==="claimable" ? "🎁 可領取" : `🔒 Lv.${o.levelReq} 升級禮物`;
      else if(o.source === "achievement"){ const sa = SPECIAL_ACHIEVEMENT_ITEMS.find(x=>x.id===o.saId); statusHTML = saStatus(sa)==="claimable" ? "🏆 可領取" : `🏆 ${Math.min(sa.need, achievementProgress(sa))}/${sa.need}`; }
      else if(levelLocked) statusHTML = `🔒 Lv.${o.levelReq} 解鎖`;
      else statusHTML = "🔒 💎"+o.price;
      card.innerHTML = `
        <div style="position:relative; width:72px; height:92px;">
          <img src="${o.image}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; filter:${o.filter} ${unlocked?'':'grayscale(1) opacity(0.5)'};">
        </div>
        <div style="font-size:12px; font-weight:800; text-align:center;">${o.name}</div>
        <div style="font-size:12px; color:var(--pink-deep); font-weight:800;">${statusHTML}</div>
      `;
      card.addEventListener('click', ()=>{
        if(equipped) return;
        if(unlocked){
          STATE.equippedOutfit = o.id;
          saveState();
          renderPreview();
          renderGrid();
          toast(o.name + " 換好了 ♡");
          return;
        }
        if(o.source === "achievement"){
          const sa = SPECIAL_ACHIEVEMENT_ITEMS.find(x=>x.id===o.saId);
          if(saStatus(sa) === "claimable") showAchievementClaim(sa.id); else toast(`達成成就就能獲得：${sa.obtainText} ♡`);
          return;
        }
        if(o.source === "level"){
          if(giftStatus("r_limited_dress") === "claimable"){ showGiftClaim("r_limited_dress"); return; }
          toast(`這件洋裝是 Lv.${o.levelReq} 的升級禮物，升到那個等級就能領取唷 ♡`);
          return;
        }
        if(levelLocked){
          toast(`要先升到 Lv.${o.levelReq} 才能解鎖這件洋裝唷 ♡`);
          return;
        }
        confirmDialog(`要用 ${o.price} 顆鑽石解鎖「${o.name}」嗎？`, ()=>{
          if(STATE.gems < o.price){
            toast("鑽石不夠唷，再多完成幾題吧 ♡");
            return;
          }
          STATE.gems -= o.price;
          STATE.unlockedOutfits.push(o.id);
          STATE.equippedOutfit = o.id;
          saveState();
          toast("✨ 新衣服解鎖！");
          render(); // 整個畫面連同頂部鑽石數字一起刷新
        });
      });
      grid.appendChild(card);
    });
  }
  renderPreview();
  renderGrid();

  app.appendChild(s);
  header.querySelector('#backBtn').addEventListener('click', ()=> go('princess'));
  attachGear(app);
}

      長按此區域 3 秒<br>進入家長設定
      <div class="hold-progress"><div class="fill" id="holdFill"></div></div>
    </div>
    <div class="action-btn secondary" id="cancelBtn">返回</div>
  `;
  app.appendChild(s);
  attachGear(app);
  s.querySelector('#cancelBtn').addEventListener('click', ()=> go('home'));

  const hintBox = s.querySelector('.lock-hint');
  const fill = s.querySelector('#holdFill');
  let holdTimer=null, start=null, raf=null;
  function beginHold(){
    start = Date.now();
    step();
  }
  function step(){
    const elapsed = Date.now()-start;
    const pct = Math.min(100, elapsed/3000*100);
    fill.style.width = pct+"%";
    if(pct>=100){ go('parent'); return; }
    raf = requestAnimationFrame(step);
  }
  function endHold(){
    if(raf) cancelAnimationFrame(raf);
    fill.style.width = "0%";
  }
  hintBox.addEventListener('mousedown', beginHold);
  hintBox.addEventListener('touchstart', (e)=>{ e.preventDefault(); beginHold(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> hintBox.addEventListener(ev, endHold));
}

    overlay.className = "confirm-overlay";
    overlay.innerHTML = `<div class="confirm-box"><p style="font-weight:800;">選擇要還原的備份</p>` +
      list.map((x,i)=>`<div class="action-btn secondary" data-i="${i}" style="margin:8px 0; text-align:left; font-size:13px;"><b>${x[0]}</b><br>${fmtTime(x[1].ts)}<br>${backupSummary(x[1].data)}</div>`).join("") +
      `<div class="action-btn secondary" id="rsCancel" style="margin:8px 0 0;">取消</div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#rsCancel').addEventListener('click', ()=> overlay.remove());
    overlay.querySelectorAll('[data-i]').forEach(el=> el.addEventListener('click', ()=>{
      const x = list[+el.getAttribute('data-i')]; overlay.remove();
      confirmDialog(`要還原到 ${fmtTime(x[1].ts)} 的備份嗎？<br><span style="font-size:12px;">${backupSummary(x[1].data)}</span>`, ()=>{
        const keep = x[1].data;
        if(x[2] !== BACKUP_PRE_KEY) snapshotState(BACKUP_PRE_KEY);
        applyState(keep); toast("已還原 ♡"); go('home');
      });
    }));
  });
}

function confirmDialog(msg, onYes){
  const overlay = document.createElement('div');
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <div class="confirm-actions">
        <button class="action-btn secondary" id="noBtn" style="margin:0;">取消</button>
        <button class="action-btn primary" id="yesBtn" style="margin:0;">確定</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#noBtn').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#yesBtn').addEventListener('click', ()=>{ overlay.remove(); onYes(); });
}

ensureDailyFresh(); ensureQuests();
migrateLevelScaleV2();
migrateRewardsV3();
checkGameAchievements(); saveState();
autoBackupDaily();
render();
// 請瀏覽器盡量不要自動清除這份資料；並註冊離線快取（本機 file:// 預覽時略過）
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}

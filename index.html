<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>注音樂園 ♡</title>
<style>
  :root{
    --cream:#FFF8EF;
    --pink:#FFD9E6;
    --pink-deep:#FF9FBF;
    --lavender:#EADCF8;
    --mint:#CFF1E4;
    --butter:#FFE9B3;
    --ink:#5B4A45;
    --ink-soft:#9C8A85;
    --white:#FFFFFF;
    --shadow:0 6px 0 rgba(255,159,191,0.35);
    --shadow-flat:0 4px 14px rgba(180,140,150,0.18);
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--cream);
    font-family:"PingFang TC","Microsoft JhengHei","Heiti TC",-apple-system,sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{padding:18px 18px 28px; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 6px;
    gap:6px;
  }
  .stat-chip{
    display:flex; align-items:center; gap:4px;
    background:var(--white); border-radius:999px;
    padding:7px 10px; font-weight:700; font-size:14px;
    box-shadow:var(--shadow-flat);
    white-space:nowrap;
  }
  .gear-btn{
    width:40px;height:40px; border-radius:50%;
    background:var(--white); box-shadow:var(--shadow-flat);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }

  /* ---------- home ---------- */
  .hero{
    text-align:center; margin:6px 0 18px;
  }
  .hero h1{
    font-size:26px; color:var(--pink-deep); font-weight:800;
    letter-spacing:.5px;
  }
  .hero .sub{
    margin-top:6px; font-size:14px; color:var(--ink-soft); font-weight:600;
  }
  .progress-row{
    display:flex; justify-content:center; gap:10px; margin:14px 0 20px;
  }
  .grid-home{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .tile{
    background:var(--white); border-radius:var(--radius-lg);
    padding:18px 10px; text-align:center;
    box-shadow:var(--shadow-flat);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(0.94);}
  .tile .emoji{font-size:34px;}
  .tile .label{font-size:15px; font-weight:800; color:var(--ink);}
  .tile.wide{grid-column:1/3;}
  .tile.c-pink{background:var(--pink);}
  .tile.c-lav{background:var(--lavender);}
  .tile.c-mint{background:var(--mint);}
  .tile.c-butter{background:var(--butter);}

  /* ---------- generic header w/ back ---------- */
  .header-row{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .back-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--white); box-shadow:var(--shadow-flat);
    font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .header-row h2{font-size:19px; font-weight:800; flex:1;}

  /* ---------- table view ---------- */
  .cat-label{
    font-size:14px; font-weight:800; color:var(--pink-deep);
    margin:16px 0 8px 4px;
  }
  .symbol-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  }
  .symbol-card{
    background:var(--white); border-radius:var(--radius-md);
    aspect-ratio:1/1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    box-shadow:var(--shadow-flat); font-size:26px; font-weight:800;
  }
  .symbol-card .spk{font-size:14px; opacity:.55;}
  .symbol-card:active{transform:scale(0.92);}
  .random-btn{
    margin-top:18px; width:100%; padding:16px; border-radius:var(--radius-md);
    background:var(--pink-deep); color:#fff; font-weight:800; font-size:16px;
    box-shadow:var(--shadow); text-align:center;
  }
  .random-card{
    margin-top:16px; background:var(--white); border-radius:var(--radius-lg);
    padding:26px; text-align:center; box-shadow:var(--shadow-flat);
  }
  .random-card .big{font-size:52px; font-weight:800; margin:10px 0;}
  .listen-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--mint); padding:12px 22px; border-radius:999px;
    font-weight:800; font-size:15px; margin-top:8px;
  }

  /* ---------- question card (shared) ---------- */
  .qcard{
    background:var(--white); border-radius:var(--radius-lg);
    padding:26px 20px; text-align:center; box-shadow:var(--shadow-flat);
    margin-bottom:18px;
  }
  .qprompt{font-size:15px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;}
  .qmain{font-size:44px; font-weight:800; margin:8px 0;}
  .qmain.emoji-big{font-size:64px;}
  .speaker-big{
    margin:10px auto 0; width:64px; height:64px; border-radius:50%;
    background:var(--butter); display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:var(--shadow-flat);
  }
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .opt-btn{
    background:var(--white); border-radius:var(--radius-md);
    padding:18px 8px; font-size:20px; font-weight:800;
    box-shadow:var(--shadow-flat); border:3px solid transparent;
  }
  .opt-btn:active{transform:scale(0.95);}
  .opt-btn.correct{background:var(--mint); border-color:#7FD9B6;}
  .opt-btn.wrong{background:#FFE0E0; border-color:#FFAFAF;}
  .feedback-msg{
    text-align:center; font-weight:800; font-size:16px; min-height:24px;
    margin:12px 0; color:var(--pink-deep);
  }
  .progress-dots{display:flex; justify-content:center; gap:6px; margin-bottom:14px;}
  .dot{width:10px; height:10px; border-radius:50%; background:#EDE3DD;}
  .dot.filled{background:var(--pink-deep);}
  .qcounter{text-align:center; font-size:13px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}

  /* ---------- result page ---------- */
  .result-card{
    background:var(--white); border-radius:var(--radius-lg); padding:30px 20px;
    text-align:center; box-shadow:var(--shadow-flat); margin-bottom:16px;
  }
  .result-card .big-emoji{font-size:56px;}
  .result-card .score{font-size:30px; font-weight:800; color:var(--pink-deep); margin:10px 0;}
  .stars-earned{font-size:26px; letter-spacing:2px; margin:6px 0;}
  .weak-chip{
    display:inline-block; background:var(--lavender); border-radius:999px;
    padding:6px 14px; font-weight:700; font-size:13px; margin:4px;
  }
  .action-btn{
    width:100%; padding:16px; border-radius:var(--radius-md); font-weight:800;
    font-size:16px; margin-top:10px; text-align:center;
  }
  .action-btn.primary{background:var(--pink-deep); color:#fff; box-shadow:var(--shadow);}
  .action-btn.secondary{background:var(--white); color:var(--ink); box-shadow:var(--shadow-flat);}

  /* ---------- stats/stars ---------- */
  .stat-card{
    background:var(--white); border-radius:var(--radius-lg); padding:18px 20px;
    box-shadow:var(--shadow-flat); margin-bottom:14px;
  }
  .stat-card .row{display:flex; justify-content:space-between; align-items:center; padding:6px 0;}
  .stat-card .row + .row{border-top:1px dashed #EFE4DD;}
  .stat-card .row .k{font-weight:700; color:var(--ink-soft); font-size:14px;}
  .stat-card .row .v{font-weight:800; font-size:16px;}
  .week-row{display:flex; justify-content:space-between; margin:10px 0;}
  .week-day{text-align:center; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .week-day .circle{
    width:28px;height:28px;border-radius:50%; margin:4px auto 0;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    background:#EFE4DD; color:#fff;
  }
  .week-day .circle.done{background:var(--mint); color:#2E7A5C;}
  .achieve-row{display:flex; gap:10px; overflow-x:auto; padding:4px 0 8px;}
  .achieve{
    flex:0 0 auto; width:88px; text-align:center; background:var(--white);
    border-radius:var(--radius-md); padding:12px 6px; box-shadow:var(--shadow-flat);
  }
  .achieve.locked{opacity:.35;}
  .achieve .a-emoji{font-size:26px;}
  .achieve .a-label{font-size:11px; font-weight:800; margin-top:4px;}

  /* ---------- parent settings ---------- */
  .setting-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--white); border-radius:var(--radius-md); padding:14px 16px;
    margin-bottom:10px; box-shadow:var(--shadow-flat);
  }
  .setting-row .label{font-weight:700; font-size:15px;}
  .switch{
    width:46px; height:26px; border-radius:999px; background:#EFE4DD; position:relative;
  }
  .switch.on{background:var(--pink-deep);}
  .switch .knob{
    width:20px; height:20px; border-radius:50%; background:#fff; position:absolute;
    top:3px; left:3px; transition:left .15s ease;
  }
  .switch.on .knob{left:23px;}
  .danger-btn{
    width:100%; padding:14px; border-radius:var(--radius-md); background:#FFE7E7;
    color:#C6534F; font-weight:800; margin-top:8px; text-align:center;
  }
  .lock-hint{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; font-weight:700;
  }
  .lock-hint .gear-big{font-size:40px; display:block; margin-bottom:14px;}
  .hold-progress{
    height:6px; background:#EFE4DD; border-radius:999px; overflow:hidden; margin-top:16px;
  }
  .hold-progress .fill{height:100%; background:var(--pink-deep); width:0%;}

  /* 領取動畫 */
  .burst{position:relative; height:0;}
  .burst span{position:absolute; left:50%; top:56px; font-size:20px; opacity:0; animation:burstOut .95s ease-out forwards;}
  @keyframes burstOut{0%{opacity:0; transform:translate(-50%,-50%) scale(.3);} 30%{opacity:1;} 100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25);}}
  @keyframes popIn{0%{transform:scale(.4);} 70%{transform:scale(1.15);} 100%{transform:scale(1);}}
  .pop-icon{animation:popIn .5s ease-out;}
  @media (prefers-reduced-motion:reduce){ .burst span,.pop-icon{animation:none;} .burst span{opacity:0;} }
  .acc-card.equipped{outline:3px solid var(--pink-deep);}
  .tab-row{display:flex; gap:8px; margin:0 0 12px;}
  .tab-btn{flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-md); background:var(--white); font-weight:800; font-size:14px; box-shadow:var(--shadow-flat); cursor:pointer;}
  .tab-btn.on{background:var(--pink-deep); color:#fff;}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px;
    font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:50; max-width:80%; text-align:center;
  }
  .toast.show{opacity:.92;}

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(91,74,69,0.45); display:flex;
    align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .confirm-box{
    background:#fff; border-radius:var(--radius-lg); padding:24px; text-align:center;
    max-width:320px; box-shadow:var(--shadow-flat);
  }
  .confirm-box p{font-weight:700; margin-bottom:16px; font-size:15px;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions button{flex:1; padding:12px; border-radius:14px; font-weight:800;}
</style>
</head>

  const found = new Set();
  CONFUSE_GROUPS.forEach(g=>{ if(g.includes(sym)) g.forEach(x=>{ if(x!==sym) found.add(x); }); });
  return [...found];

/* ---------- 拼音小高手：共用工具函式（全面以注音作答，國字僅作答對後回饋） ---------- */
function itemSyllables(item){ return item.syllables ? item.syllables : [{bopomofo:item.bopomofo, tone:item.tone}]; }
function fullSpellingItem(item){ return itemSyllables(item).map(s=>s.bopomofo + (TONE_MARKS[s.tone-1]||"")).join(' '); }
function mutateSyllableStr(syll, hard){
  const chars = syll.bopomofo.split('');
  const kind = Math.random()<0.5 ? 'tone' : 'swap';
  if(kind === 'tone'){
    let nt = syll.tone;
    while(nt === syll.tone) nt = 1 + Math.floor(Math.random()*4);
    return syll.bopomofo + (TONE_MARKS[nt-1]||"");
  } else {
    const idx = Math.floor(Math.random()*chars.length);
    const orig = chars[idx];
    let pool = hard ? confusablesFor(orig) : [];
    if(!pool.length) pool = ALL_SYMBOLS.filter(s=>s!==orig);
    const rep = pickRandom(pool);
    const nc = chars.slice(); nc[idx] = rep;
    return nc.join('') + (TONE_MARKS[syll.tone-1]||"");
  }
}
function mutateFullSpelling(item, hard){
  const sylls = itemSyllables(item);
  const idx = Math.floor(Math.random()*sylls.length);
  const parts = sylls.map((s,i)=> i===idx ? mutateSyllableStr(s,hard) : s.bopomofo+(TONE_MARKS[s.tone-1]||""));
  return parts.join(' ');
}
function buildOptionsForItem(item, hard){
  const correct = fullSpellingItem(item);
  const options = new Set([correct]);
  let tries = 0;
  while(options.size < 4 && tries < 40){
    tries++;
    const v = mutateFullSpelling(item, hard);
    if(v && v !== correct) options.add(v);
  }
  while(options.size < 4){
    const other = pickRandom(SPELL_ITEM_POOL);
    const alt = fullSpellingItem(other);
    if(alt !== correct) options.add(alt);
  }
  return shuffle([...options]);
}
function buildImageChoice(item, hard){
  return {
    kind:"image-choice", key:"word:"+item.id, item, label:item.word,
    prompt:"這是什麼？選選看 ♡",
    options: buildOptionsForItem(item, !!hard),
    answer: fullSpellingItem(item),
    render:(o)=>o
  };
}
function buildListenChoice(item, hard){
  return {
    kind:"listen-choice", key:"word:"+item.id, item, label:item.word,
    prompt:"🔊 聽一聽，選出正確的注音",
    options: buildOptionsForItem(item, !!hard),
    answer: fullSpellingItem(item),
    render:(o)=>o
  };
}
function buildFillBlank(item, hard){
  const sylls = itemSyllables(item);
  const sIdx = Math.floor(Math.random()*sylls.length);
  const syll = sylls[sIdx];
  const useTone = !!hard && Math.random() < 0.5;
  let answer, options, displayParts;
  if(useTone){
    answer = TONE_MARKS[syll.tone-1] || "";
    const allTones = [0,1,2,3,4].map(i=>TONE_MARKS[i]);
    const opts = new Set([answer]);
    shuffle(allTones).forEach(t=>{ if(opts.size<4) opts.add(t); });
    options = shuffle([...opts]);
    displayParts = sylls.map((s,i)=> i===sIdx ? s.bopomofo+"＿" : s.bopomofo+(TONE_MARKS[s.tone-1]||""));
  } else {
    const chars = syll.bopomofo.split('');
    const bIdx = chars.length - 1;
    answer = chars[bIdx];
    let pool = confusablesFor(answer);
    while(pool.length < 3){
      const r = pickRandom(FINALS.concat(MEDIALS));
      if(r !== answer && !pool.includes(r)) pool.push(r);
    }
    options = shuffle([answer, ...sample(pool,3)]);
    const blanked = chars.slice(0,bIdx).join('') + "＿";
    displayParts = sylls.map((s,i)=> i===sIdx ? blanked+(TONE_MARKS[s.tone-1]||"") : s.bopomofo+(TONE_MARKS[s.tone-1]||""));
  }
  return {
    kind:"fill-blank", key:"word:"+item.id, item, label:item.word,
    prompt: useTone ? "少了哪個聲調呢？" : "少了哪一個？",
    partial: displayParts.join(' '),
    options, answer,
    render:(o)=>(o===""?"無符號":o)
  };
}
function buildBuildQuestion(item, hard){
  return {
    kind:"build", key:"word:"+item.id, item, label:item.word,
    sylls: itemSyllables(item), step:0, collected:[], curMiss:0, totalMiss:0, hard:!!hard
  };
}
function buildSpellQuestion(){
  const lvl = STATE.spellLevel || 1;
  const r = Math.random();
  if(lvl === 1){
    const item = pickRandom(WORD_BANK);
    return r < 0.7 ? buildImageChoice(item,false) : buildFillBlank(item,false);
  } else if(lvl === 2){
    const item = pickRandom(TWO_SYLLABLE_BANK);
    return r < 0.6 ? buildListenChoice(item,false) : buildImageChoice(item,false);
  } else {
    const item = pickRandom(TWO_SYLLABLE_BANK);
    if(r < 0.4) return buildBuildQuestion(item, true);
    if(r < 0.7) return buildFillBlank(item, true);
    return buildListenChoice(item, true);
  }
}
function buildReviewSpellQuestion(item){
  const sylls = itemSyllables(item);
  return sylls.length > 1 ? buildListenChoice(item, true) : buildImageChoice(item, true);
}
function adjustSpellDifficulty(correct){
  if(correct){
    STATE.spellMissStreak = 0;
    STATE.spellStreak = (STATE.spellStreak||0) + 1;
    if(STATE.spellStreak >= 3 && STATE.spellLevel < 3){ STATE.spellLevel += 1; STATE.spellStreak = 0; }
  } else {
    STATE.spellStreak = 0;
    STATE.spellMissStreak = (STATE.spellMissStreak||0) + 1;
    if(STATE.spellMissStreak >= 2 && STATE.spellLevel > 1){ STATE.spellLevel -= 1; STATE.spellMissStreak = 0; }
  }
  saveState();
}
function isSpellKind(k){ return k==='image-choice' || k==='listen-choice' || k==='fill-blank' || k==='build'; }

let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    // 巢狀物件也要做 additive merge，避免舊資料覆蓋掉新欄位
    merged.gameStats = Object.assign({spellRounds:0, toneRounds:0, dailyRounds:0}, parsed.gameStats||{});
    merged.symbolMastery = Array.isArray(parsed.symbolMastery) ? parsed.symbolMastery : [];
    merged.specialItemsUnlocked = Array.isArray(parsed.specialItemsUnlocked) ? parsed.specialItemsUnlocked : [];
    merged.claimedRewards = Array.isArray(parsed.claimedRewards) ? parsed.claimedRewards : [];
    merged.pendingRewards = Array.isArray(parsed.pendingRewards) ? parsed.pendingRewards : [];
    merged.ownedAccessories = Array.isArray(parsed.ownedAccessories) ? parsed.ownedAccessories : ["acc_pink_bow"];
    if(!merged.ownedAccessories.includes("acc_pink_bow")) merged.ownedAccessories.push("acc_pink_bow");
    merged.implementedFeatures = Object.assign({accessories:false, room:false, bunny:false}, parsed.implementedFeatures||{});
    return merged;
  }catch(e){ return defaultState(); }
}
// 新舊公主等級門檻不同，既有使用者的星星/鑽石/紀錄完全保留，
// 只依「目前星星數」重新對應一次新等級，不重置任何資料。
function migrateLevelScaleV2(){
  if(STATE.levelScaleMigratedV2) return;
  STATE.princessLevel = princessLevelInfo(STATE.stars).lv; // 只校正等級欄位，星星/鑽石完全不動
  STATE.levelScaleMigratedV2 = true;
  saveState();
}
// v3：把「功能是否已開發 / 是否達到條件 / 實體獎勵是否已領取」拆開。
// 只新增欄位與補發待領取禮物，不動 stars / gems / 任何既有紀錄。
function migrateRewardsV3(){
  if(!STATE.rewardsV3Migrated){
    // 先前版本曾把升級獎勵 id（r_xxx）誤記成「已取得」，但那時功能並不存在 → 清掉，改由真正的領取流程處理
    STATE.specialItemsUnlocked = STATE.specialItemsUnlocked.filter(id=>!String(id).startsWith("r_"));
    // 已經實際擁有的限定洋裝不收回，視為已領取
    if(STATE.unlockedOutfits.includes("o5") && !STATE.claimedRewards.includes("r_limited_dress")) STATE.claimedRewards.push("r_limited_dress");
    STATE.rewardsV3Migrated = true;
  }
  STATE.implementedFeatures = featureFlags();
  syncPendingRewards(); // 補發過去已達成、但從未真正領取的升級禮物
  saveState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
}
function ensureDailyFresh(){
  const t = todayStr();
  if(STATE.dailyDate !== t){
    STATE.dailyDate = t;
    STATE.dailyDone = 0;
    STATE.dailyCorrect = 0;
    STATE.dailyQueue = [];
    STATE.dailyIndex = 0;
    STATE.dailyWeak = [];
    saveState();
  }
}
function updateStreak(){
  const t = todayStr();
  if(STATE.lastPracticeDate === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  if(STATE.lastPracticeDate === yStr){ STATE.streak += 1; } else { STATE.streak = 1; }
  STATE.lastPracticeDate = t;
  STATE.history7[t] = true;
  saveState();
}
function logAttempt(correct){
  const t = todayStr();
  if(!STATE.practiceLog[t]) STATE.practiceLog[t] = {attempts:0, correct:0};
  STATE.practiceLog[t].attempts += 1;
  if(correct) STATE.practiceLog[t].correct += 1;
  updateStreak();
  saveState();
}
function recordMistake(key, label, type){
  if(!STATE.mistakes[key]) STATE.mistakes[key] = {count:0, correctStreak:0, label, type};
  STATE.mistakes[key].count += 1;
  STATE.mistakes[key].correctStreak = 0;
  saveState();
}
function recordCorrectFor(key){
  if(STATE.mistakes[key]){
    STATE.mistakes[key].correctStreak = (STATE.mistakes[key].correctStreak||0) + 1;
    if(STATE.mistakes[key].correctStreak >= 3){
      delete STATE.mistakes[key];
    }
    saveState();
  }
}

function giftImplemented(g){
  if(g.type === "accessory" || g.type === "outfit") return true;
  if(g.type === "room") return FEATURES.room.implemented;
  return false; // castle
}
// "claimed" 已取得 / "claimable" 可領取 / "soon" 已達成但功能未開發 / "locked" 等級未到
function giftStatus(id){
  const g = REWARD_GIFTS[id];
  if(STATE.claimedRewards.includes(id)) return "claimed";
  if(curLevel() < g.level) return "locked";
  if(!giftImplemented(g)) return "soon";
  return "claimable";
}
function syncPendingRewards(){
  STATE.pendingRewards = STATE.pendingRewards.filter(id=> REWARD_GIFTS[id] && !STATE.claimedRewards.includes(id));
  Object.keys(REWARD_GIFTS).forEach(id=>{
    if(giftStatus(id) === "claimable" && !STATE.pendingRewards.includes(id)) STATE.pendingRewards.push(id);
  });
}
function claimReward(id){
  const g = REWARD_GIFTS[id];
  if(!g || giftStatus(id) !== "claimable") return false;
  STATE.claimedRewards.push(id);
  STATE.pendingRewards = STATE.pendingRewards.filter(x=>x!==id);
  if(g.type === "accessory" && !STATE.ownedAccessories.includes(g.itemId)) STATE.ownedAccessories.push(g.itemId);
  if(g.type === "outfit" && !STATE.unlockedOutfits.includes(g.itemId)) STATE.unlockedOutfits.push(g.itemId);
  saveState();
  return true;
}

}

const WAND_GRIP_Y = 78; // 魔法棒圖片中「握把」的位置（% 高度）
// 疊圖：背景 → 公主服裝 → 頭部飾品 → 手持魔法棒。全部以公主容器百分比定位。
function princessStackHTML(outfit, H, opts){
  opts = opts || {};
  const an = OUTFIT_ANCHORS[outfit.id] || OUTFIT_ANCHORS.o1;
  const W = Math.round(H * an.aspect);
  const head = opts.noAcc ? null : accById(STATE.equippedHeadAccessory);
  const hand = opts.noAcc ? null : accById(STATE.equippedHandAccessory);
  let layers = "";
  if(head && accClaimed(head)){
    const cx = (an.head.x + head.ox * an.head.s) * 100;
    const cy = (an.head.y + head.oy * an.head.s * an.aspect) * 100;
    const wPct = head.w * an.head.s * 100;
    layers += `<img class="acc-layer acc-head" src="${head.image}" alt="${head.name}" style="position:absolute; left:${cx}%; top:${cy}%; width:${wPct}%; transform:translate(-50%,-50%) rotate(${(head.rot||0)+(an.head.rot||0)}deg); pointer-events:none;">`;
  }
  if(hand && accClaimed(hand)){
    layers += `<img class="acc-layer acc-hand" src="${hand.image}" alt="${hand.name}" style="position:absolute; left:${an.hand.x*100}%; top:${an.hand.y*100}%; width:${hand.w*100}%; transform-origin:50% ${WAND_GRIP_Y}%; transform:translate(-50%,-${WAND_GRIP_Y}%) rotate(${an.hand.rot||0}deg); pointer-events:none;">`;
  }
  return `<div class="princess-stack" style="position:relative; width:${W}px; height:${H}px; margin:0 auto;">
    <img src="${outfit.image}" alt="${outfit.name}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; filter:${outfit.filter||''} drop-shadow(0 6px 10px rgba(180,140,150,0.25));">
    ${layers}
  </div>`;
}

let voicesCache = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  if(voicesCache && voicesCache.length) return voicesCache;
  voicesCache = speechSynthesis.getVoices();
  return voicesCache;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ voicesCache = speechSynthesis.getVoices(); };
}
function bestZhVoice(){
  const voices = pickVoice() || [];
  return voices.find(v=>/zh[-_]TW/i.test(v.lang)) ||
         voices.find(v=>/zh[-_]Hant/i.test(v.lang)) ||
         voices.find(v=>/zh/i.test(v.lang)) ||
         null;
}
function speakTTS(text){
  if(!('speechSynthesis' in window)) return;
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
    }
    setTimeout(()=>{
      try{
        const u = new SpeechSynthesisUtterance(text);
        const zh = bestZhVoice();
        if(zh){ u.voice = zh; u.lang = zh.lang; }
        else { u.lang = "zh-TW"; }
        u.rate = 0.82;
        u.pitch = 1;
        speechSynthesis.speak(u);
      }catch(e){}
    }, 60);
  }catch(e){}
}
// 單一注音：只播放官方 WAV，找不到檔案就提示錯誤，不使用 TTS 代替
function speakSymbol(sym){
  const url = SYMBOL_AUDIO_MAP[sym];
  if(!url){ toast("找不到這個注音的官方發音檔"); return; }
  const a = new Audio(url);
  a.addEventListener('error', ()=> toast("發音檔載入失敗：" + url));
  a.play().catch(()=> toast("發音檔載入失敗：" + url));
}
// 完整詞語：目前尚未提供真人錄音檔，直接同步呼叫 zh-TW TTS。
// （先前版本會先嘗試載入不存在的音檔、等404後才補講TTS，這段非同步等待
// 會讓部分手機瀏覽器判定「不是使用者點擊當下觸發」而整個不出聲，
// 所以改成點下去就同步呼叫語音，確保聽聽看一定有反應。）
// 之後若要加入真人詞語錄音，只要把對應題目 id 加進 WORD_AUDIO_AVAILABLE，
// 就會自動優先播放本機音檔、找不到才退回 TTS。
const WORD_AUDIO_AVAILABLE = new Set([]);
function speakWord(item){
  if(WORD_AUDIO_AVAILABLE.has(item.id)){
    const a = new Audio("assets/audio/words/" + item.id + ".mp3");
    a.addEventListener('error', ()=> speakTTS(item.word));
    a.play().catch(()=> speakTTS(item.word));
  } else {
    speakTTS(item.word);
  }
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 1600);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ============================================================
   遊戲引擎（聽音找注音 / 拼音小高手 / 聲調大挑戰 / 每日10題 / 錯題練習）
   ============================================================ */
function buildListenQuestion(){
  const target = pickRandom(ALL_SYMBOLS);
  let pool = confusablesFor(target);
  const need = 3;
  while(pool.length < need){
    const r = pickRandom(ALL_SYMBOLS);
    if(r !== target && !pool.includes(r)) pool.push(r);
  }
  const wrongs = sample(pool, need);
  const options = shuffle([target, ...wrongs]);
  return {
    kind:"listen",
    key:"sym:"+target,
    label:target,
    prompt:"請聽聲音，選出正確的注音",
    autoPlay:target,
    options,
    answer:target,
    render:(opt)=>opt
  };
}

function buildToneQuestion(){
  const item = pickRandom(TONE_WORD_BANK);
  const mode = pickRandom(['pickSpelling','pickToneNumber']);
  if(mode === 'pickSpelling'){
    const correct = fullSpelling(item);
    const allTones = [1,2,3,4,5];
    const opts = new Set([correct]);
    shuffle(allTones).forEach(t=>{
      if(opts.size>=4) return;
      const s = item.bopomofo + (TONE_MARKS[t-1]||"");
      opts.add(s);
    });
    return {
      kind:"tone-spelling",
      key:"tone:"+item.id,
      label: item.word,
      prompt: item.word,
      item,
      options: shuffle([...opts]),
      answer: correct,
      render:(opt)=>opt
    };
  } else {
    const correctIdx = item.tone; // 1..5
    const opts = [1,2,3,4,5];
    return {
      kind:"tone-number",
      key:"tone:"+item.id,
      label: item.word,
      prompt: "「"+item.word+"」這個字是第幾聲？",
      item,
      options: opts,
      answer: correctIdx,
      render:(opt)=> renderToneOption(opt)
    };
  }
}

function renderToneOption(opt){
  const mark = TONE_MARKS[opt-1];
  return mark === "" ? "一聲(不標)" : mark;
}
function weightedMistakeKeys(){
  return Object.entries(STATE.mistakes).sort((a,b)=>b[1].count-a[1].count).map(e=>e[0]);
}
function buildWeakFocusedQuestion(){
  const keys = weightedMistakeKeys();
  if(!keys.length) return buildListenQuestion();
  const key = pickRandom(keys.slice(0, Math.max(3,Math.ceil(keys.length/2))));
  if(key.startsWith("sym:")){
    const sym = key.slice(4);
    let pool = confusablesFor(sym);
    while(pool.length<3){ const r=pickRandom(ALL_SYMBOLS); if(r!==sym && !pool.includes(r)) pool.push(r); }
    const options = shuffle([sym, ...sample(pool,3)]);
    return { kind:"listen", key, label:sym, prompt:"請聽聲音，選出正確的注音", autoPlay:sym, options, answer:sym, render:(o)=>o };
  }
  if(key.startsWith("word:")){
    const id = key.slice(5);
    const item = WORD_BANK.find(w=>w.id===id) || TWO_SYLLABLE_BANK.find(w=>w.id===id) || TONE_WORD_BANK.find(w=>w.id===id);
    if(!item) return buildListenQuestion();
    if(typeof item.tone !== 'number') return buildReviewSpellQuestion(item);
    return Math.random()<0.5 ? buildReviewSpellQuestion(item) : buildToneQuestionFor(item);
  }
  return buildListenQuestion();
}
function buildToneQuestionFor(item){
  const correctIdx = item.tone;
  return { kind:"tone-number", key:"tone:"+item.id, label:item.word, prompt:"「"+item.word+"」這個字是第幾聲？", item, options:[1,2,3,4,5], answer:correctIdx, render:(o)=>renderToneOption(o) };
}

function buildQuestionForMode(mode, dailySlotType){
  if(mode === "listen") return buildListenQuestion();
  if(mode === "spell") return buildSpellQuestion();
  if(mode === "tone") return buildToneQuestion();
  if(mode === "review") return buildWeakFocusedQuestion();
  if(mode === "daily"){
    if(dailySlotType==="recog") return Math.random()<0.5?buildListenQuestion():buildRecogQuestion();
    if(dailySlotType==="listen") return buildListenQuestion();
    if(dailySlotType==="spell") return buildSpellQuestion();
    if(dailySlotType==="tone") return buildToneQuestion();
    if(dailySlotType==="weak") return buildWeakFocusedQuestion();
  }
  return buildListenQuestion();
}
function buildRecogQuestion(){
  // 認注音：顯示注音符號，選正確發音代表字（用文字選項呈現）
  const target = pickRandom(ALL_SYMBOLS);
  let pool = confusablesFor(target);
  while(pool.length<3){ const r=pickRandom(ALL_SYMBOLS); if(r!==target && !pool.includes(r)) pool.push(r); }
  const wrongs = sample(pool,3);
  const options = shuffle([target, ...wrongs]);
  return {
    kind:"recog",
    key:"sym:"+target,
    label:target,
    prompt:"這個注音怎麼念？點下方聽聽看，再選出一樣的注音",
    autoSymbol:target,
    options,
    answer:target,
    render:(o)=>o
  };
}

function startRound(mode){
  const total = mode === "daily" ? 10 : 8;
  let slots = [];
  if(mode === "daily"){
    slots = ["recog","recog","listen","listen","spell","spell","tone","tone","weak","weak"];
  }
  ROUND = { mode, total, index:0, correctCount:0, streak:0, weakSet:new Set(), q:null, awaitingNext:false, slots };
  nextQuestion();
}
function nextQuestion(){
  if(ROUND.index >= ROUND.total){
    finishRound();
    return;
  }
  const slotType = ROUND.mode === "daily" ? ROUND.slots[ROUND.index] : null;
  ROUND.q = buildQuestionForMode(ROUND.mode, slotType);
  ROUND.awaitingNext = false;
  ROUND.attemptCount = 0;
  render();
}
function finishRound(){
  if(ROUND.mode === "daily"){
    STATE.dailyDone = Math.min(STATE.dailyTotal, STATE.dailyDone + ROUND.total);
    STATE.dailyCorrect += ROUND.correctCount;
    STATE.dailyWeak = [...ROUND.weakSet];
    if(ROUND.correctCount === ROUND.total){ addStars(5); }
    addStars(5);
    STATE.gameStats.dailyRounds = (STATE.gameStats.dailyRounds||0) + 1;
    checkGameAchievements();
    saveState();
  } else if(ROUND.mode === "spell"){
    STATE.gameStats.spellRounds = (STATE.gameStats.spellRounds||0) + 1;
    checkGameAchievements();
    saveState();
  } else if(ROUND.mode === "tone"){
    STATE.gameStats.toneRounds = (STATE.gameStats.toneRounds||0) + 1;
    checkGameAchievements();
    saveState();
  }
  go('result');
}

/* ---------------- 拼一拼（build）：多步驟注音積木組合 ---------------- */
function renderBuildQuestionUI(s, q){
  const item = q.item;
  const card = document.createElement('div');
  card.className = "qcard";
  const remaining = q.sylls.length - q.step;
  card.innerHTML = `
    <div class="qprompt">拼一拼，組出正確的注音 ♡</div>
    <div class="qmain emoji-big">${item.emoji}</div>
    <div class="qmain" id="buildProgress">${'＿ '.repeat(remaining).trim()}</div>
  `;
  s.appendChild(card);

  const feedback = document.createElement('div');
  feedback.className = "feedback-msg";
  feedback.id = "feedback";
  s.appendChild(feedback);

  const blockWrap = document.createElement('div');
  blockWrap.className = "options";
  s.appendChild(blockWrap);

  renderBuildBlocks(blockWrap, q, feedback, card);
}
function renderBuildBlocks(blockWrap, q, feedback, card){
  const syll = q.sylls[q.step];
  const correctStr = syll.bopomofo + (TONE_MARKS[syll.tone-1]||"");
  const n = q.hard ? 4 : (q.step === 0 ? 3 : 2); // 初期較少干擾選項，進階增加
  const optSet = new Set([correctStr]);
  let tries = 0;
  while(optSet.size < n && tries < 30){ tries++; const v = mutateSyllableStr(syll, q.hard); if(v !== correctStr) optSet.add(v); }
  const options = shuffle([...optSet]);
  blockWrap.innerHTML = "";
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = "opt-btn";
    btn.textContent = opt;
    btn.addEventListener('click', ()=> handleBuildTap(opt, correctStr, btn, blockWrap, q, feedback, card));
    blockWrap.appendChild(btn);
  });
}
function handleBuildTap(opt, correctStr, btnEl, blockWrap, q, feedback, card){
  if(ROUND.awaitingNext) return;
  if(opt === correctStr){
    finishBuildStep(correctStr, blockWrap, q, feedback, card);
  } else {
    btnEl.classList.add('wrong');
    q.curMiss = (q.curMiss||0) + 1;
    if(q.curMiss === 1){
      feedback.textContent = "再想想看 ♡";
    } else {
      q.totalMiss = (q.totalMiss||0) + 1;
      [...blockWrap.children].forEach((b)=>{ if(b.textContent===correctStr) b.classList.add('correct'); b.style.pointerEvents='none'; });
      feedback.textContent = "答案是這個唷～";
      setTimeout(()=> finishBuildStep(correctStr, blockWrap, q, feedback, card), 900);
    }
  }
}
function finishBuildStep(correctStr, blockWrap, q, feedback, card){
  q.collected.push(correctStr);
  q.step += 1;
  q.curMiss = 0;
  [...blockWrap.children].forEach(b=> b.style.pointerEvents='none');
  if(q.step >= q.sylls.length){
    ROUND.awaitingNext = true;
    const ok = !(q.totalMiss > 0);
    ROUND.streak = ok ? ROUND.streak + 1 : 0;
    if(ok) ROUND.correctCount += 1;
    logAttempt(ok);
    if(ok) recordCorrectFor(q.key);
    adjustSpellDifficulty(ok);
    if(!ok){ recordMistake(q.key, q.label, q.kind); ROUND.weakSet.add(q.label); }
    let gained = ok ? 1 : 0;
    if(ok && ROUND.streak > 0 && ROUND.streak % 5 === 0) gained += 2;
    if(gained > 0) addStars(gained);
    feedback.innerHTML = spellRevealHTML(q.item);
    const rp = feedback.querySelector('#revealPlayBtn');
    if(rp) rp.addEventListener('click', ()=> speakWord(q.item));
    speakWord(q.item);
    setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 1800);
  } else {
    const progress = card.querySelector('#buildProgress');
    const doneParts = q.collected.join(' ');
    const remaining = q.sylls.length - q.step;
    progress.textContent = doneParts + ' ' + '＿ '.repeat(remaining).trim();
    feedback.textContent = "答對了！繼續下一個 ♡";
    setTimeout(()=> renderBuildBlocks(blockWrap, q, feedback, card), 500);
  }
}

function isCorrectOption(q, opt){
  return opt === q.answer;
}

// 拼音小高手答對後的回饋：圖片＋國字＋完整注音＋可再聽一次（國字只在答對後才出現）
function spellRevealHTML(item){
  return `🎉 答對了！<br>
    <div style="margin-top:6px;">
      <span style="font-size:32px;">${item.emoji}</span>
      <span style="font-size:20px; margin-left:6px;">${item.word}</span>
    </div>
    <div style="font-size:20px; font-weight:800; margin-top:4px;">${fullSpellingItem(item)}</div>
    <div class="listen-btn" id="revealPlayBtn" style="margin-top:8px;">🔊 再聽一次</div>`;
}

function handleAnswer(opt, btnEl, optWrap){
  if(ROUND.awaitingNext) return;
  const q = ROUND.q;
  const correct = isCorrectOption(q, opt);
  const feedback = document.getElementById('feedback');
  ROUND.attemptCount = (ROUND.attemptCount||0) + 1;
  const spellKind = isSpellKind(q.kind);

  if(correct){
    btnEl.classList.add('correct');
    ROUND.awaitingNext = true;
    ROUND.streak += 1;
    ROUND.correctCount += 1;
    logAttempt(true);
    recordCorrectFor(q.key);
    if(q.kind === "listen" || q.kind === "recog") recordSymbolMastery(q.key);
    if(spellKind) adjustSpellDifficulty(true);
    let gained = 1;
    if(ROUND.streak > 0 && ROUND.streak % 5 === 0) gained += 2;
    addStars(gained);
    disableOptions(optWrap);
    if(spellKind && q.item){
      feedback.innerHTML = spellRevealHTML(q.item);
      const rp = feedback.querySelector('#revealPlayBtn');
      if(rp) rp.addEventListener('click', ()=> speakWord(q.item));
      setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 1800);
    } else {
      feedback.textContent = ROUND.streak>0 && ROUND.streak%5===0 ? `連續答對 ${ROUND.streak} 題！✨ +${gained}⭐` : `答對了！ +${gained}⭐`;
      setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 700);
    }
  } else {
    btnEl.classList.add('wrong');
    ROUND.streak = 0;
    if(ROUND.attemptCount === 1){
      feedback.textContent = "再想想看 ♡ 再聽一次！";
      if(q.autoPlay || q.autoSymbol) setTimeout(()=>speakSymbol(q.autoPlay||q.autoSymbol), 300);
      else if(q.item) setTimeout(()=>speakWord(q.item), 300);
      logAttempt(false);
    } else {
      // 第二次仍答錯：標示正解，記錄錯題
      feedback.textContent = "差一點點～答案是這個唷";
      logAttempt(false);
      if(spellKind) adjustSpellDifficulty(false);
      recordMistake(q.key, q.label, q.kind);
      ROUND.weakSet.add(q.label);
      disableOptions(optWrap, true, q, optWrap);
      ROUND.awaitingNext = true;
      setTimeout(()=>{ ROUND.index += 1; nextQuestion(); }, 1200);
    }
  }
}
function disableOptions(optWrap, revealCorrect, q){
  [...optWrap.children].forEach(b=> b.style.pointerEvents = 'none');
  if(revealCorrect && q){
    [...optWrap.children].forEach((b,i)=>{
      const opt = q.options[i];
      if(isCorrectOption(q, opt)) b.classList.add('correct');
    });
    if(q.autoPlay || q.autoSymbol) speakSymbol(q.autoPlay||q.autoSymbol);
    else if(q.item) speakWord(q.item);
  }
}

function giftVisual(g, size){
  if(g.type === "accessory"){ const a = accById(g.itemId); return `<img src="${a.image}" alt="${g.name}" style="width:${size}px; height:${size}px; object-fit:contain; object-position:center;">`; }
  if(g.type === "outfit"){ const o = getOutfit(g.itemId); return `<img src="${o.image}" alt="${g.name}" style="width:${size}px; height:${size}px; object-fit:contain; object-position:center;">`; }
  return `<span style="font-size:${Math.round(size*0.8)}px;">${g.icon}</span>`;
}
// 孩子按下領取後：亮光＋星星動畫，並可「馬上戴上」
function showClaimCelebration(id){
  const g = REWARD_GIFTS[id];
  const dirs = [[-90,-70],[90,-70],[-110,10],[110,10],[-60,80],[60,80],[0,-100],[0,95],[-40,-95],[40,-95]];
  const burst = dirs.map((d,k)=>`<span style="--dx:${d[0]}px; --dy:${d[1]}px; animation-delay:${k*0.03}s;">${k%2?'⭐':'✨'}</span>`).join('');
  const isAcc = g.type === "accessory", isOutfit = g.type === "outfit";
  const a = isAcc ? accById(g.itemId) : null;
  const wearLabel = isOutfit ? "馬上換上" : (a && a.slot === "hand" ? "馬上使用" : "馬上戴上");
  const overlay = document.createElement('div');
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="burst">${burst}</div>
      <div style="font-size:20px; font-weight:800; color:var(--pink-deep);">✨ 恭喜獲得！</div>
      <div class="pop-icon" style="margin:10px 0 4px;">${giftVisual(g, 88)}</div>
      <p style="margin-bottom:14px;">${g.name}</p>
      <div class="confirm-actions">
        <button class="action-btn secondary" id="celOk" style="margin:0; white-space:nowrap;">好的</button>
        ${(isAcc || isOutfit) ? `<button class="action-btn primary" id="celWear" style="margin:0; white-space:nowrap; padding-left:10px; padding-right:10px;">${wearLabel}</button>` : ``}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const done = (after)=>{
    overlay.remove();
    if(after) after();
    render();
    if(STATE.pendingRewards.length) setTimeout(()=> showGiftClaim(), 250);
  };
  overlay.querySelector('#celOk').addEventListener('click', ()=> done());
  const w = overlay.querySelector('#celWear');
  if(w) w.addEventListener('click', ()=> done(()=>{
    if(isOutfit){ STATE.equippedOutfit = g.itemId; saveState(); toast(g.name + " 換好了 ♡"); }
    else { equipAccessory(g.itemId); toast(g.name + (a.slot==='hand' ? " 拿在手上了 ♡" : " 戴好了 ♡")); }
  }));
}
// 有可領取的升級禮物時顯示提示（onlyId 可指定領取哪一個）
function showGiftClaim(onlyId){
  const id = onlyId || STATE.pendingRewards[0];
  if(!id || giftStatus(id) !== "claimable") return;
  const g = REWARD_GIFTS[id];
  const overlay = document.createElement('div');
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <div style="font-size:18px; font-weight:800; color:var(--pink-deep);">🎁 有新的公主禮物！</div>
      <div style="margin:12px 0 4px;">${giftVisual(g, 80)}</div>
      <p style="margin-bottom:4px;">${g.name}</p>
      <div style="font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:14px;">Lv.${g.level} 升級禮物</div>
      <div class="confirm-actions">
        <button class="action-btn secondary" id="giftLater" style="margin:0; white-space:nowrap;">等一下</button>
        <button class="action-btn primary" id="giftClaim" style="margin:0; white-space:nowrap;">領取</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#giftLater').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#giftClaim').addEventListener('click', ()=>{
    overlay.remove();
    if(claimReward(id)) showClaimCelebration(id);
  });
}
function featureTileHTML(key, colorCls){
  const f = FEATURES[key], st = featureStatus(key);
  const badge = st === "soon" ? `<div style="font-size:11px; font-weight:800; color:var(--ink-soft); margin-top:2px;">🚧 即將開放</div>`
              : st === "locked" ? `<div style="font-size:11px; font-weight:800; color:var(--ink-soft); margin-top:2px;">🔒 Lv.${f.requiredLevel} 解鎖</div>` : ``;
  return `<div class="tile ${colorCls}" data-feature="${key}" data-fstate="${st}"><div class="emoji">${f.icon}</div><div class="label">${f.name}</div>${badge}</div>`;
}

/* ---------------- 收藏冊 ---------------- */
// tone: got=已取得 / gift=可領取 / locked=尚未達成 / soon=即將開放
function albumRow(iconHTML, name, statusText, tone, claimId){
  const col = tone==="got" ? "#2E9C6B" : tone==="gift" ? "var(--pink-deep)" : "var(--ink-soft)";
  const dim = (tone==="locked" || tone==="soon");
  return `
    <div ${claimId ? `data-claim="${claimId}"` : ""} style="display:flex; align-items:center; gap:10px; background:${tone==='got'||tone==='gift' ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.45)'}; border-radius:14px; padding:10px 12px; margin-bottom:8px; ${claimId?'cursor:pointer;':''}">
      <div style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:26px; ${dim?'filter:grayscale(1); opacity:0.55;':''}">${iconHTML}</div>
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:800; color:${dim?'var(--ink-soft)':'var(--ink)'};">${name}</div>
        <div style="font-size:11px; color:${col}; font-weight:800; margin-top:2px;">${statusText}</div>
      </div>
      ${tone==="gift" ? `<div class="action-btn primary" style="margin:0; padding:6px 14px; width:auto; font-size:12px;">領取</div>` : ``}
    </div>`;
}
function accThumb(a){ return `<img src="${a.image}" alt="${a.name}" style="width:34px; height:34px; object-fit:contain; object-position:center;">`; }
function accObtain(a){
  if(accClaimed(a)) return {text:"✓ 已取得", tone:"got"};
  if(a.unlockType === "level"){
    const st = giftStatus(a.rewardId);
    if(st === "claimable") return {text:"🎁 可領取", tone:"gift", claim:a.rewardId};
    return {text:`🔒 Lv.${a.requiredLevel} 升級禮物`, tone:"locked"};
  }
  if(a.unlockType === "diamond") return {text:`💎${a.price} 解鎖`, tone:"locked"};
  return {text:"—", tone:"locked"};
}
function renderAlbum(){
  app.appendChild(topStatsBar());
  const s = document.createElement('div');
  s.className = "screen";
  const header = document.createElement('div');
  header.className = "header-row";
  header.innerHTML = `<div class="back-btn" id="backBtn">←</div><h2>收藏冊</h2>`;
  s.appendChild(header);

  const intro = document.createElement('div');
  intro.className = "qprompt";
  intro.style.margin = "0 0 10px";
  intro.textContent = "看看公主已經擁有的，以及下一個目標是什麼 ♡";
  s.appendChild(intro);

  function section(title, rowsHTML){
    const c = document.createElement('div');
    c.className = "stat-card";
    c.innerHTML = `<div style="font-size:14px; font-weight:800; margin-bottom:8px;">${title}</div>${rowsHTML}`;
    s.appendChild(c);
  }

  // 🔓 公主成長解鎖：只放「功能」；只有真正能操作的才顯示「已開放」
  section("🔓 公主成長解鎖", Object.keys(FEATURES).map(k=>{
    const f = FEATURES[k], st = featureStatus(k);
    if(st === "open")   return albumRow(f.icon, f.name, "✓ 已開放", "got");
    if(st === "locked") return albumRow(f.icon, f.name, `🔒 Lv.${f.requiredLevel} 解鎖`, "locked");
    return albumRow(f.icon, f.name, "🚧 即將開放", "soon");
  }).join(""));

  // 🎁 公主升級禮物：實體物品，要領取才算取得
  section("🎁 公主升級禮物", Object.keys(REWARD_GIFTS).map(id=>{
    const g = REWARD_GIFTS[id], st = giftStatus(id);
    const icon = (g.type==="accessory"||g.type==="outfit") ? giftVisual(g, 34) : g.icon;
    if(st === "claimed")   return albumRow(icon, g.name, "✓ 已取得", "got");
    if(st === "claimable") return albumRow(icon, g.name, `🎁 可領取（Lv.${g.level}）`, "gift", id);
    if(st === "soon")      return albumRow(icon, g.name, `🚧 即將開放（已達成 Lv.${g.level}）`, "soon");
    return albumRow(icon, g.name, `🔒 Lv.${g.level} 升級禮物`, "locked");
  }).join(""));

  // 🏆 收藏：真正存在的物品，每個未取得的都寫「如何取得」
  section("👗 洋裝收藏", OUTFITS.map(o=>{
    const got = STATE.unlockedOutfits.includes(o.id);
    const thumb = `<img src="${o.image}" alt="${o.name}" style="width:34px; height:34px; object-fit:contain; object-position:center;">`;
    if(got) return albumRow(thumb, o.name, "✓ 已取得", "got");
    if(o.source === "level"){
      return giftStatus("r_limited_dress") === "claimable"
        ? albumRow(thumb, o.name, "🎁 可領取", "gift", "r_limited_dress")
        : albumRow(thumb, o.name, `🔒 Lv.${o.levelReq} 升級禮物`, "locked");
    }
    return albumRow(thumb, o.name, outfitLevelLocked(o) ? `🔒 Lv.${o.levelReq} 解鎖 ＋ 💎${o.price}` : `💎${o.price} 解鎖`, "locked");
  }).join(""));
  ACC_CATEGORIES.forEach(cat=>{
    section(`${cat.icon} ${cat.label}`, ACCESSORIES.filter(a=>a.category===cat.key).map(a=>{
      const o = accObtain(a);
      return albumRow(accThumb(a), a.name, o.text, o.tone, o.claim);
    }).join(""));
  });
  section("🏆 成就限定", SPECIAL_ACHIEVEMENT_ITEMS.map(a=>{
    const achieved = STATE.specialItemsUnlocked.includes(a.id);
    const prog = Math.min(a.need, achievementProgress(a));
    if(achieved && !a.implemented) return albumRow(a.icon, a.name, `🚧 即將開放（條件已達成：${a.obtainText}）`, "soon");
    if(achieved) return albumRow(a.icon, a.name, "✓ 已取得", "got");
    return albumRow(a.icon, a.name, `🏆 ${a.obtainText}（${prog}/${a.need}）`, "locked");
  }).join(""));

  app.appendChild(s);
  header.querySelector('#backBtn').addEventListener('click', ()=> go('princess'));
  s.querySelectorAll('[data-claim]').forEach(el=>{
    el.addEventListener('click', ()=> showGiftClaim(el.getAttribute('data-claim')));
  });
  attachGear(app);
}

    if(!owned && a.unlockType==="diamond") status = "🔒 💎" + a.price;
    card.innerHTML = `
      <div style="position:relative; width:64px; height:64px;">
        <img src="${a.image}" alt="${a.name}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; ${owned?'':'filter:grayscale(1) opacity(0.5);'}">

    card.addEventListener('click', ()=>{

  });

  app.appendChild(s);

/* ---------------- 換裝 ---------------- */
function renderDressUp(){
  app.appendChild(topStatsBar());
  const s = document.createElement('div');
  s.className = "screen";
  const header = document.createElement('div');
  header.className = "header-row";
  header.innerHTML = `<div class="back-btn" id="backBtn">←</div><h2>換裝</h2>`;
  s.appendChild(header);

  const preview = document.createElement('div');
  preview.className = "stat-card";
  preview.style.textAlign = "center";
  preview.style.background = "linear-gradient(180deg, #F3E9FB 0%, #FFF8EF 70%)";
  s.appendChild(preview);

  const grid = document.createElement('div');
  grid.className = "symbol-grid";
  grid.style.gridTemplateColumns = "1fr 1fr 1fr";
  s.appendChild(grid);

  function renderPreview(){
    const cur = getOutfit(STATE.equippedOutfit);
    preview.innerHTML = `
      ${princessStackHTML(cur, 208)}
      <div style="font-size:14px; font-weight:800; color:var(--pink-deep); margin-top:6px;">${cur.name}</div>
    `;
  }
  function renderGrid(){
    grid.innerHTML = "";
    OUTFITS.forEach(o=>{
      const unlocked = STATE.unlockedOutfits.includes(o.id);
      const equipped = STATE.equippedOutfit === o.id;
      const levelLocked = !unlocked && outfitLevelLocked(o);
      const card = document.createElement('div');
      card.className = "symbol-card";
      card.style.aspectRatio = "auto";
      card.style.padding = "10px 6px";
      card.style.gap = "4px";
      let statusHTML;
      if(equipped) statusHTML = "✨ 穿著中";
      else if(unlocked) statusHTML = "點一下換上";
      else if(o.source === "level") statusHTML = giftStatus("r_limited_dress")==="claimable" ? "🎁 可領取" : `🔒 Lv.${o.levelReq} 升級禮物`;
      else if(levelLocked) statusHTML = `🔒 Lv.${o.levelReq} 解鎖`;
      else statusHTML = "🔒 💎"+o.price;
      card.innerHTML = `
        <div style="position:relative; width:72px; height:92px;">
          <img src="${o.image}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; filter:${o.filter} ${unlocked?'':'grayscale(1) opacity(0.5)'};">
        </div>
        <div style="font-size:12px; font-weight:800; text-align:center;">${o.name}</div>
        <div style="font-size:12px; color:var(--pink-deep); font-weight:800;">${statusHTML}</div>
      `;
      card.addEventListener('click', ()=>{
        if(equipped) return;
        if(unlocked){
          STATE.equippedOutfit = o.id;
          saveState();
          renderPreview();
          renderGrid();
          toast(o.name + " 換好了 ♡");
          return;
        }
        if(o.source === "level"){
          if(giftStatus("r_limited_dress") === "claimable"){ showGiftClaim("r_limited_dress"); return; }
          toast(`這件洋裝是 Lv.${o.levelReq} 的升級禮物，升到那個等級就能領取唷 ♡`);
          return;
        }
        if(levelLocked){
          toast(`要先升到 Lv.${o.levelReq} 才能解鎖這件洋裝唷 ♡`);
          return;
        }
        confirmDialog(`要用 ${o.price} 顆鑽石解鎖「${o.name}」嗎？`, ()=>{
          if(STATE.gems < o.price){
            toast("鑽石不夠唷，再多完成幾題吧 ♡");
            return;
          }
          STATE.gems -= o.price;
          STATE.unlockedOutfits.push(o.id);
          STATE.equippedOutfit = o.id;
          saveState();
          toast("✨ 新衣服解鎖！");
          render(); // 整個畫面連同頂部鑽石數字一起刷新
        });
      });
      grid.appendChild(card);
    });
  }
  renderPreview();
  renderGrid();

  app.appendChild(s);
  header.querySelector('#backBtn').addEventListener('click', ()=> go('princess'));
  attachGear(app);
}

function renderStats(){
  app.appendChild(topStatsBar());
  const s = document.createElement('div');
  s.className = "screen";
  const header = document.createElement('div');
  header.className = "header-row";
  header.innerHTML = `<div class="back-btn" id="backBtn">←</div><h2>學習統計</h2>`;
  s.appendChild(header);

  const t = todayStr();
  const todayLog = STATE.practiceLog[t] || {attempts:0, correct:0};
  const rate = todayLog.attempts ? Math.round(todayLog.correct/todayLog.attempts*100) : 0;
  let totalAttempts=0, totalCorrect=0;
  Object.values(STATE.practiceLog).forEach(l=>{ totalAttempts+=l.attempts; totalCorrect+=l.correct; });

  const card = document.createElement('div');
  card.className = "stat-card";
  card.innerHTML = `
    <div class="row"><div class="k">今天完成幾題</div><div class="v">${todayLog.attempts}</div></div>
    <div class="row"><div class="k">今天答對率</div><div class="v">${rate}%</div></div>
    <div class="row"><div class="k">累積練習題數</div><div class="v">${totalAttempts}</div></div>
  `;
  s.appendChild(card);

  const lab = document.createElement('div');
  lab.className = "cat-label";
  lab.textContent = "最近7天練習";
  s.appendChild(lab);
  const weekWrap = document.createElement('div');
  weekWrap.className = "week-row";
  const days = ["日","一","二","三","四","五","六"];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    const done = !!STATE.practiceLog[key];
    const el = document.createElement('div');
    el.className = "week-day";
    el.innerHTML = `${days[d.getDay()]}<div class="circle ${done?'done':''}">${done?'✓':'—'}</div>`;
    weekWrap.appendChild(el);
  }
  s.appendChild(weekWrap);

  const mistakeEntries = Object.entries(STATE.mistakes).sort((a,b)=>b[1].count-a[1].count).slice(0,8);
  const lab2 = document.createElement('div');
  lab2.className = "cat-label";
  lab2.textContent = "需要加強";
  s.appendChild(lab2);
  const card2 = document.createElement('div');
  card2.className = "stat-card";
  if(mistakeEntries.length===0){
    card2.innerHTML = `<div class="row"><div class="k">目前沒有需要加強的項目 🎉</div></div>`;
  } else {
    card2.innerHTML = mistakeEntries.map(([k,v])=>`<div class="row"><div class="k">${v.label}</div><div class="v">${'★'.repeat(Math.min(5,v.count))}</div></div>`).join('');
  }
  s.appendChild(card2);

  app.appendChild(s);
  header.querySelector('#backBtn').addEventListener('click', ()=> go('home'));
  attachGear(app);
}

/* ---------------- 家長設定：長按解鎖 ---------------- */
function renderParentLock(){
  app.appendChild(topStatsBar());
  const s = document.createElement('div');
  s.className = "screen";
  s.innerHTML = `
    <div class="lock-hint">
      <span class="gear-big">⚙️</span>
      長按此區域 3 秒<br>進入家長設定
      <div class="hold-progress"><div class="fill" id="holdFill"></div></div>
    </div>
    <div class="action-btn secondary" id="cancelBtn">返回</div>
  `;
  app.appendChild(s);
  attachGear(app);
  s.querySelector('#cancelBtn').addEventListener('click', ()=> go('home'));

  const hintBox = s.querySelector('.lock-hint');
  const fill = s.querySelector('#holdFill');
  let holdTimer=null, start=null, raf=null;
  function beginHold(){
    start = Date.now();
    step();
  }
  function step(){
    const elapsed = Date.now()-start;
    const pct = Math.min(100, elapsed/3000*100);
    fill.style.width = pct+"%";
    if(pct>=100){ go('parent'); return; }
    raf = requestAnimationFrame(step);
  }
  function endHold(){
    if(raf) cancelAnimationFrame(raf);
    fill.style.width = "0%";
  }
  hintBox.addEventListener('mousedown', beginHold);
  hintBox.addEventListener('touchstart', (e)=>{ e.preventDefault(); beginHold(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> hintBox.addEventListener(ev, endHold));
}

function confirmDialog(msg, onYes){
  const overlay = document.createElement('div');
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <div class="confirm-actions">
        <button class="action-btn secondary" id="noBtn" style="margin:0;">取消</button>
        <button class="action-btn primary" id="yesBtn" style="margin:0;">確定</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#noBtn').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#yesBtn').addEventListener('click', ()=>{ overlay.remove(); onYes(); });
}
